<style>
  /* ── Design Tokens ── */
  body { min-height: 100dvh; max-width: var(--reading-max); margin: 0 auto; display: flex; flex-direction: column; }

  /* ── HEADER (minimal) ── */
  #site-header {
    position: fixed; top: 16px; right: 16px; z-index: 200;
  }
  .hamburger-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--color-surface); border: 1px solid var(--color-border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-card); transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .hamburger-btn:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }

  /* Slide menu */
  .slide-menu {
    position: fixed; top: 0; right: 0; width: 300px; height: 100dvh;
    background: var(--color-surface); z-index: 300;
    box-shadow: -8px 0 32px rgba(0,0,0,0.1);
    transform: translateX(100%);
    transition: transform var(--dur-base) var(--ease-out);
    padding: var(--space-3); overflow-y: auto;
  }
  .slide-menu.open { transform: translateX(0); }
  .slide-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 250;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .slide-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--space-3); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-border);
  }
  .menu-logo {
    font-family: var(--font-body); font-weight: var(--weight-bold); font-size: var(--text-body); color: var(--color-text);
  }
  .menu-close {
    width: 36px; height: 36px; border-radius: 50%; background: var(--color-surface);
    border: none; cursor: pointer; font-size: var(--text-h3); color: var(--color-text-muted);
    display: flex; align-items: center; justify-content: center; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .menu-close:hover { color: var(--color-text); background: var(--color-border); }
  .menu-section { margin-bottom: 20px; }
  .menu-section-title {
    font-size: var(--text-label); font-weight: var(--weight-semibold); color: var(--color-text-muted);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: var(--radius);
    font-size: var(--text-sm); color: var(--color-text); text-decoration: none;
    transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); cursor: pointer;
    background: none; border: none; width: 100%; text-align: left;
    font-family: var(--font-body);
  }
  .menu-item:hover { background: var(--color-surface); color: var(--color-text); }
  .menu-item svg { flex-shrink: 0; color: var(--color-text-muted); }
  .menu-item:hover svg { color: var(--color-text); }
  .menu-divider { height: 1px; background: var(--color-border); margin: 12px 0; }

  /* ── LANDING (Google-style center) ── */
  #landing {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; padding: 40px 20px 20px; text-align: center;
  }
  .landing-logo {
    font-family: var(--font-body); font-size: var(--text-h1); font-weight: var(--weight-bold);
    color: var(--color-text); margin-bottom: var(--space-4); letter-spacing: -0.5px;
    text-decoration: none; display: inline-block;
  }
  .landing-logo:hover { color: var(--color-text); }

  /* ── MAIN CONTENT ── */
  #main-content { }

  /* ── CHAT SECTION ── */
  #chat-section {
    padding: 0 20px; background: var(--color-surface); width: 100%;
  }
  .chat-container {
    max-width: 800px; margin: 0 auto;
  }
  .section-label {
    font-family: var(--font-body); font-size: var(--text-label); font-weight: var(--weight-bold);
    color: var(--color-text); text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 10px; text-align: center;
  }
  .section-heading {
    font-family: var(--font-body); font-size: var(--text-h2); font-weight: var(--weight-bold);
    color: var(--color-text); text-align: center; margin-bottom: var(--space-1);
  }
  .section-desc {
    text-align: center; color: var(--color-text-muted); font-size: var(--text-sm);
    margin-bottom: var(--space-4); line-height: var(--leading-normal);
  }
  .chat-card {
    background: var(--color-surface); border-radius: var(--radius);
    box-shadow: var(--shadow-lift); border: 1px solid var(--color-border);
    overflow: visible; display: flex; flex-direction: column;
    /* #landing의 text-align:center 상속 차단 — 답변 본문·리스트는 좌측 정렬 */
    text-align: left;
  }

  /* Chat messages area — hidden until first interaction */
  #chat {
    height: 0; min-height: 0; max-height: 0; overflow: hidden;
    padding: 0 20px; display: flex; flex-direction: column; gap: 12px;
    transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .chat-card.active #chat {
    height: auto; min-height: 0; max-height: none;
    overflow-y: visible; padding: 20px;
  }

  /* Fullview — not used in single Q&A mode */
  #chat-fullview { display: none; }

  /* ── Answer Action Bar ── */
  .answer-actions {
    display: flex; gap: var(--space-1); flex-wrap: wrap; justify-content: center;
    padding: var(--space-2) 20px; border-top: 1px solid var(--color-border);
    animation: fadeInUp 0.3s ease;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .answer-actions button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; font-size: var(--text-sm); font-weight: var(--weight-medium);
    color: var(--color-text-muted); background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); font-family: var(--font-body);
    white-space: nowrap;
  }
  .answer-actions button:hover {
    border-color: var(--accent); color: var(--color-text);
    box-shadow: var(--shadow-card); transform: translateY(-1px);
  }
  .answer-actions button.done {
    color: var(--color-text); border-color: var(--color-text); font-weight: var(--weight-bold);
  }

  /* Collapsed input — prominent search bar style */
  .chat-card:not(.active) #input-wrapper { border-top: none; }
  .chat-card:not(.active) #input-area textarea {
    font-size: var(--text-body); padding: 14px 20px; min-height: 52px;
    background: var(--color-surface); border-radius: var(--radius);
  }
  .chat-card:not(.active) #input-area { padding: var(--space-2) 20px; }


  /* Messages */
  .msg { max-width: 100%; padding: 12px var(--space-2); border-radius: 14px; font-size: var(--text-sm); line-height: var(--leading-relaxed); word-break: break-word; }
  .msg.user {
    align-self: flex-end; background: var(--color-text); color: var(--color-bg);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start; width: 100%; background: var(--color-surface); border: 1px solid var(--color-border);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant > :first-child { margin-top: 0; }
  .msg.assistant > :last-child { margin-bottom: 0; }
  .msg.status { align-self: center; background: transparent; color: var(--color-text-muted); font-size: var(--text-label); padding: var(--space-half) var(--space-1); }

  .sources { font-size: var(--text-label); color: var(--color-text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-border); }
  .sources a { color: var(--color-text-muted); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .calc-result { margin: 0 0 12px; border: 1px solid var(--color-border); border-left: 3px solid var(--accent); border-radius: var(--radius); background: var(--color-surface); overflow-x: auto; }
  .calc-result-body { margin: 0; padding: 12px 14px; font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: var(--text-label); line-height: var(--leading-base); color: var(--color-text); white-space: pre; }

  /* Contact cards */
  .contact-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; max-width: 80%; }
  .contact-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); font-size: var(--text-label); color: var(--color-text); line-height: var(--leading-snug); }
  .contact-chip .cc-name { font-weight: var(--weight-semibold); white-space: nowrap; }
  .contact-chip .cc-phone { color: var(--color-text-muted); font-weight: var(--weight-semibold); white-space: nowrap; }
  .contact-chip .cc-desc { color: var(--color-text-muted); }
  .contact-chip a { color: var(--color-text-muted); text-decoration: none; }
  .contact-chip a:hover { text-decoration: underline; }

  /* ── Markdown in assistant messages ── */
  .msg.assistant h2 { font-size: var(--text-h3); margin: 18px 0 var(--space-1); padding-bottom: var(--space-half); border-bottom: 1px solid var(--color-border); }
  .msg.assistant h3 { font-size: var(--text-body); margin: 14px 0 6px; }
  .msg.assistant p { margin: var(--space-1) 0; }
  .msg.assistant ul, .msg.assistant ol { margin: var(--space-1) 0 var(--space-1) 22px; }
  .msg.assistant li { margin: 3px 0; }
  .msg.assistant li > ul { margin: 3px 0 3px 18px; }
  .msg.assistant li > ul li { font-size: var(--text-sm); }
  .msg.assistant .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0; border: 1px solid var(--color-border); border-radius: 8px; }
  .msg.assistant table { border-collapse: collapse; font-size: var(--text-sm); width: 100%; margin: 0; }
  .msg.assistant th { background: var(--color-text); color: var(--color-bg); font-weight: var(--weight-semibold); padding: var(--space-1) 12px; text-align: left; white-space: nowrap; border: none; border-bottom: 2px solid var(--color-border); }
  .msg.assistant td { padding: 7px 12px; text-align: left; border: none; border-bottom: 1px solid var(--color-border); word-break: keep-all; }
  .msg.assistant tr:nth-child(even) td { background: var(--color-surface); }
  .msg.assistant tr:last-child td { border-bottom: none; }
  .msg.assistant tr.total-row td { font-weight: var(--weight-bold); border-top: 2px solid var(--color-text); background: var(--color-surface); }
  .msg.assistant td.num-cell { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .msg.assistant code { background: var(--color-surface); padding: 1px var(--space-half); border-radius: 3px; font-size: var(--text-label); }
  .msg.assistant pre { background: var(--color-surface); padding: 10px; border-radius: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: var(--space-1) 0; }
  .msg.assistant pre code { background: none; padding: 0; }
  .msg.assistant strong { font-weight: var(--weight-semibold); }
  .msg.assistant blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--color-text-muted); margin: 6px 0; }
  .msg.assistant .callout { border-left: 4px solid var(--color-border); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 10px 0; font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--color-text); }
  .msg.assistant .callout-title { font-weight: var(--weight-bold); font-size: var(--text-sm); margin-bottom: var(--space-half); display: flex; align-items: center; gap: 6px; }
  .msg.assistant .callout-legal  { background: var(--color-surface); border-left-color: var(--color-border-strong); }
  .msg.assistant .callout-warn   { background: var(--color-surface); border-left-color: var(--color-text); }
  .msg.assistant .callout-danger { background: var(--color-surface); border-left-color: var(--color-text); border-left-width: 6px; }
  .msg.assistant .callout-tip    { background: var(--color-surface); border-left-color: var(--color-border); }
  .msg.assistant .summary-badge { background: var(--color-surface); border-left: 5px solid var(--accent); border-radius: 0 10px 10px 0; padding: 12px var(--space-2); margin: 10px 0; font-size: var(--text-sm); line-height: var(--leading-relaxed); }
  .msg.assistant .summary-badge h2 { font-size: var(--text-body); margin: 0 0 6px; border-bottom: none; padding-bottom: 0; }
  .msg.assistant .step-list { list-style: none; margin: 10px 0; padding: 0; counter-reset: step-counter; }
  .msg.assistant .step-list > li { counter-increment: step-counter; position: relative; padding: var(--space-1) 0 var(--space-1) 40px; margin: 0; line-height: var(--leading-base); font-size: var(--text-sm); }
  .msg.assistant .step-list > li::before { content: counter(step-counter); position: absolute; left: 0; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--color-text); color: var(--color-bg); font-size: var(--text-label); font-weight: var(--weight-bold); display: flex; align-items: center; justify-content: center; }
  .msg.assistant .step-list > li::after { content: ''; position: absolute; left: 12px; top: 36px; width: 2px; height: calc(100% - 28px); background: var(--color-border); }
  .msg.assistant .step-list > li:last-child::after { display: none; }
  .msg.assistant .step-list ul { list-style: disc; margin: var(--space-half) 0 0 18px; padding: 0; }
  .msg.assistant .step-list ul li { padding: 2px 0; }
  .msg.assistant hr { border: none; height: 1px; background: var(--color-border); margin: 18px 0; }
  .msg.assistant .disclaimer-notice { font-size: var(--text-label); color: var(--color-text-muted); border-top: 1px solid var(--color-border); margin-top: 14px; padding-top: 10px; line-height: var(--leading-base); }
  .msg.assistant .math-display { overflow-x: auto; margin: 10px 0; text-align: center; }
  .msg.assistant .math-inline { display: inline; }

  /* 답변 상단 목차와 접기 UI.
     sticky는 **모바일에서만 유효**하다. #chat은 base가 overflow:hidden이고 활성 시
     overflow-y:visible이라, 명세상 visible이 auto로 계산돼 이미 스크롤 컨테이너다.
     그런데 데스크톱은 height:auto라 내부 스크롤이 생기지 않아 붙을 스크롤포트가
     없다(모바일만 height:50vh라 동작). 그래서 전 환경 경로로 #glance-jump-core
     버튼을 함께 둔다 — 둘 중 하나만 남기지 말 것.
     배경색은 .msg.assistant와 같아야 본문이 목차 뒤로 비쳐 보이지 않는다. */
  .answer-outline { position: sticky; top: 8px; z-index: 4; display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding: var(--space-1) 0; background: var(--color-surface); border-bottom: 1px solid var(--color-border); scrollbar-width: none; }
  .answer-outline::-webkit-scrollbar { display: none; }
  .outline-chip { flex: 0 0 auto; max-width: 180px; min-height: 32px; display: inline-flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: var(--space-half) 10px; border: 1px solid var(--color-border); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text-muted); font-size: var(--text-label); text-decoration: none; line-height: var(--leading-normal); }
  .outline-chip:hover { color: var(--color-text); border-color: var(--color-text-muted); }
  .outline-chip:focus-visible { outline: 2px solid var(--color-text-muted); outline-offset: 2px; }
  .msg.assistant details { margin: 10px 0; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }
  /* 터치 타겟 44px 확보 (Plan NFR) */
  .msg.assistant details > summary { cursor: pointer; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text); line-height: var(--leading-base); list-style: none; }
  .msg.assistant details > summary::-webkit-details-marker { display: none; }
  .msg.assistant details > summary::before { content: '▸'; flex: 0 0 auto; color: var(--color-text); transition: transform 0.15s; }
  .msg.assistant details[open] > summary::before { transform: rotate(90deg); }
  .msg.assistant details > summary:focus-visible { outline: 2px solid var(--color-text-muted); outline-offset: -2px; }
  .msg.assistant details > *:not(summary) { margin-left: 14px; margin-right: 14px; }
  /* 표·콜아웃은 특이도가 더 높은 자기 규칙(.table-wrap 등)을 가져 위 규칙에 지므로
     따로 맞춰준다 — 안 하면 접힌 섹션 안에서 이것들만 좌측에 붙는다 */
  .msg.assistant details > .table-wrap,
  .msg.assistant details > .callout { margin-left: 14px; margin-right: 14px; }
  .msg.assistant details > *:last-child { margin-bottom: 12px; }
  /* #back-to-top(bottom:24px, 44px)의 바로 위에 쌓는다 — 겹치면 둘 다 못 누른다.
     opacity만으로 숨기면 보이지 않는 채 탭 순서에 남으므로 visibility를 함께 끈다. */
  #glance-jump-core { position: fixed; bottom: 76px; right: 24px; z-index: 90; padding: var(--space-1) 14px; min-height: 44px; border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); box-shadow: var(--shadow-lift); cursor: pointer; font-size: var(--text-label); font-weight: var(--weight-semibold); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out); }
  #glance-jump-core.show { opacity: 1; visibility: visible; pointer-events: auto; }
  #glance-jump-core:hover { border-color: var(--color-text-muted); }

  /* Copy button */
  .msg-wrapper { display: flex; flex-direction: column; }
  .msg-wrapper.user-side { align-items: flex-end; }
  .msg-wrapper.assistant-side { align-items: flex-start; }
  .copy-btn { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; padding: var(--space-half) var(--space-1); cursor: pointer; color: var(--color-text-muted); font-size: var(--text-label); opacity: 0; transition: opacity 0.15s; display: inline-flex; align-items: center; gap: var(--space-half); margin-top: var(--space-half); align-self: flex-start; }
  .msg-wrapper:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--color-text); border-color: var(--accent); }
  .copy-btn.copied { color: var(--color-text); border-color: var(--color-text); font-weight: var(--weight-bold); }

  /* Chat input area */
  #input-wrapper { border-top: 1px solid var(--color-border); background: var(--color-surface); padding-bottom: env(safe-area-inset-bottom); }
  #file-preview { display: flex; gap: 6px; padding: var(--space-1) 20px 0; flex-wrap: wrap; }
  #file-preview:empty { display: none; }
  .file-chip { display: inline-flex; align-items: center; gap: var(--space-half); padding: var(--space-half) 10px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; font-size: var(--text-label); color: var(--color-text); }
  .file-chip img { width: 20px; height: 20px; object-fit: cover; border-radius: 3px; }
  .file-chip .remove { cursor: pointer; color: var(--color-text-muted); font-weight: bold; margin-left: 2px; }
  .file-chip .remove:hover { color: var(--color-text); }
  #input-area { padding: 14px 20px; display: flex; gap: var(--space-1); align-items: center; }
  #attach-btn {
    background: none; border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 9px; cursor: pointer; color: var(--color-text-muted);
    display: flex; align-items: center; flex-shrink: 0; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  #attach-btn:hover { border-color: var(--accent); color: var(--color-text); }
  #input-area textarea {
    flex: 1; border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 10px var(--space-2); font-size: var(--text-sm); outline: none; resize: none;
    min-height: 42px; max-height: 120px; line-height: var(--leading-base); font-family: var(--font-body);
    overflow-y: auto; background: var(--color-surface);
  }
  .input-hint {
    text-align: center; font-size: var(--text-label); color: var(--color-text-muted); padding: var(--space-half) 0 0;
  }
  #input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px transparent; }
  #send-btn {
    background: var(--color-text); color: var(--color-bg); border: none; border-radius: var(--radius);
    padding: 10px 22px; font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: pointer;
    font-family: var(--font-body); transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); white-space: nowrap;
  }
  #send-btn:hover { background: var(--color-text-muted); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Drop overlay */
  #drop-overlay { display: none; position: fixed; inset: 0; background: rgba(var(--accent-rgb), 0.08); border: 3px dashed var(--accent); z-index: 200; align-items: center; justify-content: center; font-size: var(--text-h3); color: var(--color-text); font-weight: var(--weight-semibold); pointer-events: none; }
  #drop-overlay.active { display: flex; }

  /* ── FAQ SECTION (hidden by default, accessible from menu) ── */
  #faq-section { padding: 80px 20px; background: var(--color-surface); display: none; }
  #faq-section.visible { display: block; }
  .faq-container { max-width: 800px; margin: 0 auto; }
  #faq-tabs { display: flex; gap: var(--space-1); padding-bottom: var(--space-3); justify-content: center; flex-wrap: wrap; }
  .faq-tab {
    padding: var(--space-1) 18px; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    background: transparent; cursor: pointer; font-size: var(--text-sm); font-weight: var(--weight-medium);
    white-space: nowrap; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); font-family: var(--font-body); color: var(--color-text-muted);
  }
  .faq-tab:hover { border-color: var(--accent); color: var(--color-text); }
  .faq-tab.active { background: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }
  #faq-list { display: flex; flex-direction: column; gap: var(--space-1); }
  .faq-item {
    padding: 14px 18px; background: var(--color-surface); border: 1px solid transparent;
    border-radius: var(--radius); cursor: pointer; font-size: var(--text-sm); text-align: left;
    transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); display: flex; align-items: center; gap: 10px;
    font-family: var(--font-body); color: var(--color-text); width: 100%;
  }
  .faq-item:hover { border-color: var(--accent); background: var(--color-surface); box-shadow: var(--shadow-card); transform: translateX(4px); }
  .faq-item::before { content: "\1F4AC"; font-size: var(--text-body); flex-shrink: 0; }
  .faq-item::after {
    content: '\2192'; margin-left: auto; color: var(--color-text-muted); font-size: var(--text-body);
    opacity: 0; transition: opacity 0.2s; flex-shrink: 0;
  }
  .faq-item:hover::after { opacity: 1; color: var(--color-text); }

  /* ── BOARD SECTION (hidden by default) ── */
  #board-section { padding: 80px 20px; background: var(--color-surface); display: none; }
  #board-section.visible { display: block; }
  .board-container { max-width: 800px; margin: 0 auto; }
  .board-item { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); margin-bottom: var(--space-1); overflow: hidden; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }
  .board-item:hover { border-color: var(--accent); box-shadow: var(--shadow-card); }
  .board-q { padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); }
  .board-q .board-cat { background: rgba(var(--accent-rgb), 0.1); color: var(--color-text); font-size: var(--text-label); font-weight: var(--weight-semibold); padding: 3px 10px; border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0; }
  .board-q .board-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-q .board-time { color: var(--color-text-muted); font-size: var(--text-label); white-space: nowrap; flex-shrink: 0; }
  .board-q .board-chevron { color: var(--color-text-muted); transition: transform 0.25s; flex-shrink: 0; font-size: var(--text-label); }
  .board-item.open .board-chevron { transform: rotate(180deg); }
  .board-a { display: none; padding: 0 18px 14px; font-size: var(--text-label); color: var(--color-text-muted); line-height: var(--leading-relaxed); border-top: 1px solid var(--color-border); padding-top: 14px; }
  .board-item.open .board-a { display: block; }
  .board-ask-btn { display: inline-block; margin-top: var(--space-1); color: var(--color-text); font-size: var(--text-label); font-weight: var(--weight-semibold); cursor: pointer; background: none; border: none; font-family: var(--font-body); }
  .board-ask-btn:hover { text-decoration: underline; }
  .retry-btn { margin-top: var(--space-1); padding: 6px 14px; color: var(--color-text); font-size: var(--text-label); font-weight: var(--weight-semibold); cursor: pointer; background: none; border: 1px solid var(--accent); border-radius: var(--radius-pill); font-family: var(--font-body); }
  .retry-btn:hover { background: rgba(var(--accent-rgb), 0.1); }
  .retry-btn:disabled { opacity: 0.5; cursor: default; }

  /* Email modal */
  .email-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 400; display: none; align-items: center; justify-content: center; padding: 20px; }
  .email-modal-overlay.open { display: flex; }
  .email-modal { background: var(--color-surface); border-radius: var(--radius); padding: 28px; max-width: 380px; width: 100%; box-shadow: var(--shadow-lift); }
  .email-modal h3 { margin: 0 0 18px; font-size: var(--text-h3); font-weight: var(--weight-bold); color: var(--color-text); font-family: var(--font-body); }
  .email-modal label { display: block; font-size: var(--text-label); font-weight: var(--weight-semibold); margin: 14px 0 6px; color: var(--color-text-muted); }
  .email-modal input { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: var(--text-sm); font-family: var(--font-body); box-sizing: border-box; }
  .email-modal input:focus { outline: none; border-color: var(--accent); }
  .email-modal-error { color: var(--color-text); font-weight: var(--weight-medium); font-size: var(--text-label); margin-top: var(--space-1); min-height: 16px; }
  .email-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .email-modal-actions button { flex: 1; padding: 10px; border-radius: var(--radius); font-weight: var(--weight-semibold); cursor: pointer; font-family: var(--font-body); font-size: var(--text-sm); }
  .email-modal-cancel { background: none; border: 1px solid var(--color-border); color: var(--color-text-muted); }
  .email-modal-submit { background: var(--accent); border: none; color: var(--accent-on); }
  .email-modal-submit:disabled { opacity: 0.5; cursor: default; }
  #board-more-btn { border: none; background: none; cursor: pointer; color: var(--color-text); font-size: var(--text-sm); font-weight: var(--weight-semibold); font-family: var(--font-body); padding: var(--space-1) var(--space-2); }
  #board-more-btn:hover { text-decoration: underline; }
  .section-link-wrap { text-align: center; margin-top: 20px; }

  /* ── FOOTER (sticky bottom, 3 lines) ── */
  #site-footer {
    background: var(--color-surface); border-top: 1px solid var(--color-border); color: var(--color-text-muted); padding: 12px var(--space-3);
    font-size: var(--text-label); line-height: var(--leading-normal); border-radius: var(--radius) var(--radius) 0 0;
    margin-top: auto; text-align: center;
  }
  .footer-inner { max-width: 800px; margin: 0 auto; }
  .footer-title { color: var(--color-text); font-family: var(--font-body); font-size: var(--text-sm); font-weight: var(--weight-bold); }
  .footer-info { color: var(--color-text-muted); margin: 2px 0; }
  .footer-info a { color: var(--color-text-muted); text-decoration: none; }
  .footer-info a:hover { text-decoration: underline; }
  .footer-links { display: flex; gap: var(--space-1); justify-content: center; }
  .footer-links a { color: var(--color-text-muted); text-decoration: none; font-size: var(--text-label); }
  .footer-links a:hover { color: var(--color-text); }

  /* ── Back to Top ── */
  #back-to-top {
    position: fixed; bottom: 24px; right: 24px; z-index: 90;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--color-text); color: var(--color-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none;
    transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  #back-to-top.visible { opacity: 1; pointer-events: auto; }
  #back-to-top:hover { background: var(--accent); transform: translateY(-2px); }

  /* ── MOBILE RESPONSIVE ── */
  @media (max-width: 768px) {
    .landing-logo { font-size: var(--text-h2); }
    .slide-menu { width: 280px; }
  }

  @media (max-width: 600px) {
    .copy-btn { opacity: 0.7; }
    .msg { max-width: 100%; }
    #input-area { padding: 10px; }
    #file-preview { padding: var(--space-1) 10px 0; }
    #send-btn { min-height: 44px; min-width: 44px; padding: 10px var(--space-2); }
    #attach-btn { min-width: 44px; min-height: 44px; }
    .file-chip .remove { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; min-height: 28px; font-size: var(--text-h3); }
    .contact-bar { max-width: 100%; }
    .contact-chip { flex: 1 1 100%; min-width: 0; }
    #chat-section, #faq-section, #board-section { padding: var(--space-6) var(--space-2); }
    .section-heading { font-size: var(--text-h2); }
    #faq-tabs { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chat-card.active #chat { height: 50vh; min-height: 300px; }
    .footer-info { font-size: var(--text-label); }
    .msg.assistant .callout { padding: var(--space-1) 10px; margin: var(--space-1) 0; }
    .msg.assistant .summary-badge { padding: 10px 12px; }
    .msg.assistant .step-list > li { padding-left: 34px; }
    .msg.assistant .step-list > li::before { width: 22px; height: 22px; font-size: var(--text-label); }
    .msg.assistant .step-list > li::after { left: 10px; top: 32px; }
    .outline-chip { max-width: 128px; font-size: var(--text-label); }
    #glance-jump-core { bottom: 72px; right: 16px; padding: 6px 12px; font-size: var(--text-label); }
    .msg.assistant table { font-size: var(--text-label); }
    .msg.assistant th, .msg.assistant td { padding: 6px 10px; }
    .msg.assistant ul, .msg.assistant ol { margin-left: 18px; }
    .msg.assistant li > ul { margin-left: 14px; }
  }

  /* ── 공지사항 배너 ── */
  #notice-banner {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 0 var(--space-2) var(--space-half); padding: 11px 14px;
    border-radius: var(--radius); border: 1px solid var(--color-text-muted);
    background: var(--color-surface); font-size: var(--text-sm); line-height: var(--leading-normal); color: var(--color-text);
  }
  #notice-banner[hidden] { display: none; }
  #notice-banner.level-warn { border-color: var(--color-text); border-left-width: 4px; }
  #notice-banner .notice-icon { flex-shrink: 0; font-size: var(--text-sm); line-height: var(--leading-normal); }
  #notice-banner .notice-body { flex: 1; min-width: 0; }
  #notice-banner .notice-link {
    display: inline-block; margin-left: 6px; color: var(--color-text);
    font-weight: var(--weight-medium); text-decoration: underline; white-space: nowrap;
  }
  #notice-banner .notice-close {
    flex-shrink: 0; background: none; border: none; cursor: pointer;
    color: var(--color-text-muted); font-size: var(--text-h3); line-height: var(--leading-none);
    padding: 0 2px; min-width: 24px; min-height: 24px;
  }
  #notice-banner .notice-close:hover { color: var(--color-text); }
  /* #site-header는 position:fixed(z-index 200)로 화면 우상단에 떠 있다. 뷰포트가 좁아지면
     배너 오른쪽이 그 아래로 들어가 닫기 버튼이 눌리지 않으므로 우측 여백을 비워 둔다.
     기준: 헤더 44px + right 16px + 간격 → 56px. */
  @media (max-width: 900px) {
    #notice-banner { padding-right: 56px; }
  }
  @media (max-width: 600px) {
    #notice-banner { margin: 0 12px var(--space-half); font-size: var(--text-label); padding: 10px 56px 10px 12px; }
    #notice-banner .notice-link { display: block; margin-left: 0; margin-top: var(--space-half); }
  }
</style>
</head>

// ── 대화 저장 (마크다운) ────────────────────────────────────────────────────

document.getElementById('export-btn').addEventListener('click', exportChatMarkdown);

function exportChatMarkdown() {
  const wrappers = chat.querySelectorAll('.msg-wrapper');
  const pairs = [];
  let questionNum = 0;

  for (const w of wrappers) {
    const userEl = w.querySelector('.msg.user');
    const assistantEl = w.querySelector('.msg.assistant');

    if (userEl) {
      questionNum++;
      pairs.push({ type: 'user', num: questionNum, text: userEl.innerText.trim() });
    }
    if (assistantEl) {
      if (questionNum === 0) continue;
      const mdText = assistantEl.dataset.md || assistantEl.innerText;
      pairs.push({ type: 'assistant', num: questionNum, text: mdText.trim() });
    }
  }

  if (pairs.length === 0) {
    alert('저장할 대화 내용이 없습니다.');
    return;
  }

  const now = new Date();
  const dateStr = now.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  const lines = [
    '# 기초 노동상담 기록\n',
    `> 날짜: ${dateStr}`,
    '> 출처: nodong.kr AI 노동상담 챗봇\n',
    '---\n',
  ];

  for (const p of pairs) {
    if (p.type === 'user') {
      lines.push(`## 질문 ${p.num}\n`);
      lines.push(p.text + '\n');
    } else {
      lines.push(`## 답변 ${p.num}\n`);
      lines.push(p.text + '\n');
      lines.push('---\n');
    }
  }

  lines.push('> 본 상담 기록은 AI가 제공한 참고 정보이며, 법적 효력이 없습니다.');
  lines.push('> 정확한 사항은 고용노동부(1350) 또는 공인노무사에게 확인하시기 바랍니다.');

  const md_text = lines.join('\n');
  const ts = now.toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const filename = `기초노동상담_${ts}.md`;
  const blob = new Blob([md_text], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);

  const exportBtn = document.getElementById('export-btn');
  exportBtn.classList.add('exported');
  exportBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 저장됨';
  setTimeout(() => {
    exportBtn.classList.remove('exported');
    exportBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 저장';
  }, 2000);
}

// 브라우저가 MIME을 비워 보내는 파일(.md 등)은 확장자로 보정 —
// 그대로 octet-stream을 보내면 백엔드 허용 목록에서 거부된다.
function guessMime(f) {
  if (f.type && f.type !== 'application/octet-stream') return f.type;
  const n = f.name.toLowerCase();
  if (n.endsWith('.txt')) return 'text/plain';
  if (n.endsWith('.md')) return 'text/markdown';
  if (n.endsWith('.pdf')) return 'application/pdf';
  if (n.endsWith('.png')) return 'image/png';
  if (n.endsWith('.jpg') || n.endsWith('.jpeg')) return 'image/jpeg';
  if (n.endsWith('.webp')) return 'image/webp';
  if (n.endsWith('.gif')) return 'image/gif';
  return f.type || 'application/octet-stream';
}

// base64 인코딩이 용량을 4/3배로 부풀리므로, 합계가 이 값을 넘으면
// Vercel 요청 바디 한도(4.5MB)에 걸려 413으로 거부된다. 사전 차단.
const MAX_TOTAL_BYTES = 3 * 1024 * 1024;

// 서버(file_parser.py) 허용 목록과 동일 — image/*로 느슨하게 받으면
// svg/heic 등이 드래그앤드롭(accept 미적용)으로 통과 후 서버에서 거부된다
const ALLOWED_MIMES = new Set([
  'image/jpeg', 'image/png', 'image/webp', 'image/gif',
  'application/pdf', 'text/plain', 'text/markdown',
]);

function addFiles(files) {
  for (const f of files) {
    if (pendingFiles.length >= MAX_FILES) {
      alert('파일은 최대 3개까지 첨부할 수 있습니다.');
      break;
    }
    const mime = guessMime(f);
    const ok = ALLOWED_MIMES.has(mime);
    if (!ok) {
      alert('지원하지 않는 파일 형식입니다: ' + f.name + '\n이미지(JPG/PNG), PDF, TXT 파일만 가능합니다.');
      continue;
    }
    const maxMB = mime.startsWith('image/') ? 3 : mime === 'application/pdf' ? 3 : 1;
    if (f.size > maxMB * 1024 * 1024) {
      alert('파일이 너무 큽니다: ' + f.name + ' (최대 ' + maxMB + 'MB)');
      continue;
    }
    const totalBytes = pendingFiles.reduce((s, p) => s + p.size, 0) + f.size;
    if (totalBytes > MAX_TOTAL_BYTES) {
      alert('첨부 파일 용량 합계는 3MB 이하여야 합니다.\n(' + f.name + ' 추가 시 초과)');
      continue;
    }
    pendingFiles.push(f);
  }
  renderPreview();
}

function renderPreview() {
  filePreview.innerHTML = '';
  pendingFiles.forEach((f, i) => {
    const chip = document.createElement('span');
    chip.className = 'file-chip';
    if (f.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      chip.appendChild(img);
    }
    const name = document.createElement('span');
    const sizeMB = (f.size / 1024 / 1024).toFixed(1);
    name.textContent = f.name + ' (' + sizeMB + 'MB)';
    chip.appendChild(name);
    const rm = document.createElement('span');
    rm.className = 'remove';
    rm.textContent = '\u00d7';
    rm.onclick = () => { pendingFiles.splice(i, 1); renderPreview(); };
    chip.appendChild(rm);
    filePreview.appendChild(chip);
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function addMsg(role, html, rawMarkdown) {

function ensureCopyBtn(el) {

function copyConversation(wrapper, cbtn) {
  const parts = [];
  let prev = wrapper.previousElementSibling;
  while (prev && prev.classList.contains('msg-wrapper') && !prev.querySelector('.msg.user')) {
    prev = prev.previousElementSibling;
  }
  if (prev && prev.querySelector('.msg.user')) {
    const userEl = prev.querySelector('.msg.user');
    parts.push('**Q.** ' + userEl.textContent.trim());
  }
  const assistantEl = wrapper.querySelector('.msg.assistant');
  const mdText = assistantEl.dataset.md || assistantEl.textContent;
  parts.push('**A.**\n' + mdText.trim());

  navigator.clipboard.writeText(parts.join('\n\n')).then(() => {
    cbtn.classList.add('copied');
    cbtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(() => {
      cbtn.classList.remove('copied');
      cbtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
    }, 2000);
  });
}

// ── KaTeX ────────────────────────────────────────────────────────────────────

function renderTex(tex, displayMode) {
  if (typeof katex === 'undefined') {
    const cls = displayMode ? 'math-display' : 'math-inline';
    const delim = displayMode ? '$$' : '$';
    return '<span class="' + cls + ' math-pending" data-tex="' + tex.replace(/"/g, '&quot;') + '" data-display="' + displayMode + '">' + delim + tex + delim + '</span>';
  }
  try {
    const html = katex.renderToString(tex, { displayMode, throwOnError: false, trust: true });
    return displayMode
      ? '<div class="math-display">' + html + '</div>'
      : '<span class="math-inline">' + html + '</span>';
  } catch (e) {
    return '<code>' + tex + '</code>';
  }
}

function renderPendingMath(container) {
  if (typeof katex === 'undefined') return;
  container.querySelectorAll('.math-pending').forEach(el => {
    const tex = el.getAttribute('data-tex');
    const displayMode = el.getAttribute('data-display') === 'true';
    try {
      const html = katex.renderToString(tex, { displayMode, throwOnError: false, trust: true });
      if (displayMode) {
        const div = document.createElement('div');
        div.className = 'math-display';
        div.innerHTML = html;
        el.replaceWith(div);
      } else {
        const span = document.createElement('span');
        span.className = 'math-inline';
        span.innerHTML = html;
        el.replaceWith(span);
      }
    } catch (e) { /* keep raw */ }
  });
}

// ── Markdown → HTML ──────────────────────────────────────────────────────────

function renderMdLink(txt, url) {
  // javascript:/data: 등 위험 스킴 차단 (href 인젝션 방지)
  const safeHref = /^(https?:|mailto:)/i.test(url) ? url : '#';
  return '<a href="' + safeHref + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
}

function inlineTransform(t) {
  return t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, url) => renderMdLink(txt, url));
}

function indentWidth(s) {
  let w = 0;
  for (const ch of s) w += ch === '\t' ? 2 : 1;
  return w;
}

// 들여쓰기 스택 기반 중첩 <ul> 빌더. LLM 출력의 2·3·4칸 들여쓰기 혼용을 ±1칸
// 허용치로 흡수하고, 과도한 깊이는 중첩 2단계(level 0·1·2)에서 캡한다.
function buildNestedUl(items) {
  const stack = [items[0].indent];
  let html = '<ul>';
  for (const { indent, text } of items) {
    while (stack.length > 1 && indent < stack[stack.length - 1] - 1) {
      html += '</ul></li>';
      stack.pop();
    }
    if (indent > stack[stack.length - 1] + 1 && stack.length < 3 && html.endsWith('</li>')) {
      html = html.slice(0, -5) + '<ul>';
      stack.push(indent);
    }
    html += '<li>' + inlineTransform(text) + '</li>';
  }
  while (stack.length > 1) { html += '</ul></li>'; stack.pop(); }
  return html + '</ul>';
}

const CALLOUT_MAP = [
  { pattern: /^(?:📘\s*)?(?:\*\*)?(?:법적\s*근거|관련\s*법조문|관련\s*법률|관련\s*판례|법령)(?:\*\*)?/i, type: 'legal', icon: '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M8 7h7M8 11h7"/></svg>' },
  { pattern: /^(?:⚠️\s*)?(?:\*\*)?(?:주의사항|주의|유의|예외)(?:\*\*)?/i, type: 'warn', icon: '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4L2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/></svg>' },
  { pattern: /^(?:🚨\s*)?(?:\*\*)?(?:중요|필수|경고|금지)(?:\*\*)?/i, type: 'danger', icon: '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7z"/><path d="M12 8v5M12 16.2v.1"/></svg>' },
  { pattern: /^(?:💡\s*)?(?:\*\*)?(?:참고|팁|알아두세요|도움말|안내)(?:\*\*)?/i, type: 'tip', icon: '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5.9 1.2.9 1.9v.2h5.2v-.2c0-.7.3-1.4.9-1.9A6 6 0 0012 3z"/></svg>' },
];

function md(text) {
  const blocks = [];
  function stash(html) { blocks.push(html); return '\x00B' + (blocks.length - 1) + '\x00'; }

  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    stash('<pre><code>' + code.replace(/</g, '&lt;') + '</code></pre>')
  );
  text = text.replace(/\$\$([\s\S]*?)\$\$/g, (_, tex) => stash(renderTex(tex.trim(), true)));
  text = text.replace(/\\\[([\s\S]*?)\\\]/g, (_, tex) => stash(renderTex(tex.trim(), true)));
  text = text.replace(/\$([^\$\n]+?)\$/g, (_, tex) => stash(renderTex(tex.trim(), false)));
  text = text.replace(/\\\(([\s\S]*?)\\\)/g, (_, tex) => stash(renderTex(tex.trim(), false)));

  // XSS 방지: 코드/수식은 이미 stash로 분리됐으므로, 잔여 마크다운 본문(표·리스트·
  // 헤더·굵게·링크 등)에서 태그 오프닝·속성 이탈에 쓰이는 &,<,"만 이스케이프한다.
  // 마크다운 문법(#,*,-,|,>,[]())은 이 문자들을 쓰지 않으므로 파싱에 영향 없다.
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  text = text.replace(/((?:^\|.+\|[ \t]*$\n?)+)/gm, block => {
    const rows = block.trim().split('\n');
    let h = '<div class="table-wrap"><table>';
    let headerDone = false;
    for (const row of rows) {
      if (/^\|[\s:|-]+\|$/.test(row.trim())) { headerDone = true; continue; }
      const cells = row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const tag = !headerDone ? 'th' : 'td';
      const isTotal = cells.some(c => /^(?:\*\*)?(?:합\s*계|총\s*계|소\s*계|total|sum)(?:\*\*)?$/i.test(c.replace(/\*\*/g, '').trim()));
      h += '<tr' + (isTotal ? ' class="total-row"' : '') + '>';
      for (const c of cells) {
        const isNum = (tag === 'td') && /^[\d,]+(?:\.\d+)?(?:\s*원)?$/.test(c.replace(/\*\*/g, '').trim());
        // 셀 내용에도 인라인 변환 적용 — 미적용 시 **볼드**가 별표 원문째 노출됨
        h += '<' + tag + (isNum ? ' class="num-cell"' : '') + '>' + inlineTransform(c) + '</' + tag + '>';
      }
      h += '</tr>';
      if (!headerDone) headerDone = true;
    }
    h += '</table></div>';
    return stash(h) + '\n';
  });

  // 번호 목록을 불릿보다 먼저 파싱 — 번호 항목에 딸린 들여쓴 하위 불릿을 항목 안에
  // 직접 수용한다. 과거엔 불릿이 먼저 통째로 stash되어 placeholder가 다음 번호 줄과
  // 붙는 바람에 ② 이후 항목이 ①에 병합되고 하위 불릿 내용은 미복원으로 소실됐음.
  text = text.replace(/((?:^[ \t]*\d+\.[ \t].+(?:\n(?![ \t]*\d+\.[ \t])(?![-*][ \t]).+)*$\n?)+)/gm, (block, _, offset) => {
    const preceding = text.slice(Math.max(0, offset - 200), offset);
    const isStep = /(?:절차|방법|순서|과정|단계|대응|신청|진행)\s*$/m.test(preceding)
      || /^#{2,3}\s.*(?:절차|방법|순서|과정|단계|대응|신청|진행)/m.test(preceding);
    // 번호 줄마다 새 항목 시작, 들여쓴 불릿 줄은 해당 항목의 하위 목록으로,
    // 그 외 후속 줄(계산식 "→ ..." 등)은 직전 항목 본문에 병합해 순번(1·2·3)을 유지한다.
    const items = [];
    for (const line of block.replace(/\n+$/, '').split('\n')) {
      const num = line.match(/^[ \t]*\d+\.[ \t]+(.*)$/);
      const sub = line.match(/^([ \t]+)[-*][ \t]+(.*)$/);
      if (num) items.push({ text: num[1], subs: [] });
      else if (sub && items.length) items[items.length - 1].subs.push({ indent: indentWidth(sub[1]), text: sub[2] });
      else if (items.length) items[items.length - 1].text += '\n' + line.trim();
    }
    const lis = items.map(it => {
      let inner = inlineTransform(it.text).replace(/\n/g, '<br>');
      if (it.subs.length) inner += buildNestedUl(it.subs);
      return '<li>' + inner + '</li>';
    }).join('');
    return stash(isStep ? '<ol class="step-list">' + lis + '</ol>' : '<ol>' + lis + '</ol>') + '\n';
  });

  text = text.replace(/((?:^[ \t]*[-*][ \t].+$\n?)+)/gm, block => {
    // 들여쓰기 스택 기반 중첩 <ul> — 평탄화하던 과거와 달리 하위 항목 구조를 보존한다.
    const items = block.replace(/\n+$/, '').split('\n').map(l => {
      const m = l.match(/^([ \t]*)[-*][ \t]+(.*)$/);
      return m && { indent: indentWidth(m[1]), text: m[2] };
    }).filter(Boolean);
    if (!items.length) return block;
    return stash(buildNestedUl(items)) + '\n';
  });

  text = text.replace(/((?:^> .+$\n?)+)/gm, block => {
    const lines = block.trim().split('\n').map(l => l.replace(/^> ?/, ''));
    const joined = lines.join('\n');
    for (const { pattern, type, icon } of CALLOUT_MAP) {
      const m = joined.match(pattern);
      if (m) {
        const title = m[0].replace(/\*\*/g, '');
        const body = inlineTransform(joined.slice(m[0].length).replace(/^[\s:：\-]+/, '')).replace(/\n/g, '<br>');
        return stash('<div class="callout callout-' + type + '"><div class="callout-title">' + icon + ' ' + title + '</div>' + body + '</div>') + '\n';
      }
    }
    return stash('<blockquote>' + inlineTransform(joined).replace(/\n/g, '<br>') + '</blockquote>') + '\n';
  });

  let html = text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, (_, title) => {
      if (/^(?:⚖️\s*|📋\s*)?(?:핵심\s*답변|결론|답변\s*요약|요약)/.test(title)) {
        return '<div class="summary-badge"><h2>' + title + '</h2></div>';
      }
      return '<h2>' + title + '</h2>';
    })
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, url) => renderMdLink(txt, url))
    .replace(/^---$/gm, '<hr>');

  html = html.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
  // 고정점 루프 복원 — stash된 블록 HTML 안에 다른 placeholder가 들어 있는 경우
  // (번호 목록이 표·불릿 블록을 삼킨 케이스) 단일 패스로는 영구 미복원되어
  // 내용이 소실되므로, 잔여 placeholder가 없어질 때까지 반복한다(순환 없음: DAG).
  let prevHtml;
  do {
    prevHtml = html;
    html = html.replace(/\x00B(\d+)\x00/g, (_, i) => '</p>' + blocks[+i] + '<p>');
  } while (html !== prevHtml);
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><br>/g, '<p>');
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/(<p>(?:⚠️\s*)?본\s*(?:답변|계산\s*결과|판정\s*결과)은?\s*참고용[\s\S]*?<\/p>)$/, '<div class="disclaimer-notice">$1</div>');
  return html;
}

// ── SSE 읽기 공통 ────────────────────────────────────────────────────────────

function renderContacts(agencies, afterEl) {
  const wrapper = afterEl.closest('.msg-wrapper');
  if (!wrapper || wrapper.querySelector('.contact-bar')) return;
  const bar = document.createElement('div');
  bar.className = 'contact-bar';
  for (const a of agencies) {
    const chip = document.createElement('span');
    chip.className = 'contact-chip';
    let html = '<span class="cc-name">' + a.name + '</span> '
             + '<span class="cc-phone">' + a.phone + '</span>';
    if (a.url) html += ' <a href="https://' + a.url + '" target="_blank">' + a.url + '</a>';
    if (a.desc) html += '<br><span class="cc-desc">' + a.desc + '</span>';
    chip.innerHTML = html;
    bar.appendChild(chip);
  }
  const copyBtnEl = wrapper.querySelector('.copy-btn');
  if (copyBtnEl) wrapper.insertBefore(bar, copyBtnEl);
  else wrapper.appendChild(bar);
}

async function readSSE(resp, onActivity) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let statusEl = addMsg('status', '질문 분석 중...');
  let assistantEl = null;
  let fullText = '';
  let pendingContacts = null;
  let pendingSources = null;
  let pendingCalc = null;
  let streamDone = false;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    if (onActivity) onActivity();   // 데이터 수신 → idle 타이머 리셋
    buffer += decoder.decode(value, { stream: true });

    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const event = JSON.parse(line.slice(6));

      if (event.type === 'done') {          // 완료 마커 (서버가 저장까지 마친 뒤 전송)
        streamDone = true;
        break;
      } else if (event.type === 'session') {
        sessionId = event.session_id;
        try { sessionStorage.setItem('chatSessionId', sessionId); } catch (e) { /* ignore */ }
      } else if (event.type === 'status') {
        statusEl.textContent = event.text;
      } else if (event.type === 'contacts') {
        pendingContacts = event.agencies;
      } else if (event.type === 'error') {
        removeStatus();
        const el = addMsg('assistant', event.text);
        ensureCopyBtn(el);
        if (pendingContacts) renderContacts(pendingContacts, el);
      } else if (event.type === 'sources') {
        pendingSources = event.hits || null;   // 답변 완료 후 출처 표시
      } else if (event.type === 'meta') {
        if (event.calc_result) pendingCalc = event.calc_result;   // 답변 완료 후 정확 계산값 카드로 표시
      } else if (event.type === 'replace') {
        if (assistantEl) {
          fullText = event.text;
          assistantEl.innerHTML = md(fullText);
          assistantEl.dataset.md = fullText;
          renderPendingMath(assistantEl);
          chat.scrollTop = chat.scrollHeight;
        }
      } else if (event.type === 'chunk') {
        removeStatus();
        if (!assistantEl) assistantEl = addMsg('assistant', '', '');
        fullText += event.text;
        assistantEl.innerHTML = md(fullText);
        assistantEl.dataset.md = fullText;
        renderPendingMath(assistantEl);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (streamDone) break;
  }
  // done 수신 = 서버가 저장을 마쳤다는 뜻. 스트림을 명시적으로 닫는다
  if (streamDone) {
    try { await reader.cancel(); } catch (_) { /* ignore */ }
  }
  // 마지막 assistant 메시지에 액션 바 표시
  var lastAssistant = assistantEl || chat.querySelector('.msg-wrapper.assistant-side:last-of-type .msg.assistant');
  if (lastAssistant) {
    renderCalcResult(pendingCalc, lastAssistant);
    renderSources(pendingSources, lastAssistant);
    if (pendingContacts) renderContacts(pendingContacts, lastAssistant);
    chat.scrollTop = chat.scrollHeight;
    showAnswerActions(lastAssistant);
    // 조망 레이어(목차·접기)는 답변 확정 후 1회만 — 스트리밍 중엔 heading이 미완성이라
    // 목차가 어긋난다. replace(인용 교정) 이벤트도 이 루프 안에서 이미 처리됐으므로
    // 여기서는 항상 최종 텍스트를 본다.
    if (window.answerGlance) window.answerGlance.finalize(lastAssistant);
  }
  if (!assistantEl && !lastAssistant && !document.querySelector('.msg.status + .msg.assistant')) {
    removeStatus();
    addMsg('assistant', '서버 응답이 중단되었습니다. 잠시 후 다시 시도해주세요.');
  }
}

// ── 답변 출처 표시 (sources 이벤트) ──────────────────────────────────────────
// 말풍선(innerHTML 교체 대상) 바깥에 붙여 replace 이벤트에도 보존된다.

function renderSources(hits, el) {
  if (!hits || !hits.length || !el) return;
  var labels = { precedent: '판례', interpretation: '행정해석', regulation: '훈령·예규',
                 counsel: '노무사 상담', qa: '상담 Q&A' };
  var div = document.createElement('div');
  div.className = 'sources';
  div.textContent = '근거 자료: ' + hits.map(function (h) {
    var label = labels[h.source_type] || h.source_type || '자료';
    return '[' + label + '] ' + h.title + (h.section ? ' — ' + h.section : '');
  }).join('  ·  ');
  el.insertAdjacentElement('afterend', div);
}

// ── 정확 계산값 카드 (meta.calc_result) ──────────────────────────────────────
// 계산기 산출값은 사전 포맷된 플레인 텍스트 — 정렬·줄바꿈 보존 위해 <pre>로 렌더.
// LLM 답변의 수치 재현에 의존하지 않는 '결정적' 표시. 말풍선 바깥이라 replace에도 보존.

function renderCalcResult(text, el) {
  if (!text || !el) return;
  var div = document.createElement('div');
  div.className = 'calc-result';
  var pre = document.createElement('pre');
  pre.className = 'calc-result-body';
  pre.textContent = text;   // textContent — XSS 안전, 원문 그대로
  div.appendChild(pre);
  el.insertAdjacentElement('beforebegin', div);   // 답변 위에 정확값 먼저
}

// ── 답변 완료 후 액션 바 ─────────────────────────────────────────────────────

function showAnswerActions(el) {
  const card = document.getElementById('chat-card');
  const old = card.querySelector('.answer-actions');
  if (old) old.remove();

  const bar = document.createElement('div');
  bar.className = 'answer-actions';
  bar.innerHTML =
    '<button onclick="actionCopy(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 복사하기</button>' +
    '<button onclick="actionPDF()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> PDF 저장</button>' +
    '<button onclick="actionMarkdown()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Markdown 저장</button>' +
    '<button onclick="openEmailModal(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg> 이메일 전송</button>';
  card.appendChild(bar);
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getQAPair() {
  // 전체 대화 내용을 수집 (이어지는 질문 포함)
  let fullMd = '', fullHtml = '', lastQuestion = '';
  const wrappers = chat.querySelectorAll('.msg-wrapper');
  wrappers.forEach(function(w) {
    const q = w.querySelector('.msg.user');
    const a = w.querySelector('.msg.assistant:not(.status)');
    if (q) { lastQuestion = q.textContent.trim(); fullMd += '\n\n## 질문\n\n' + lastQuestion; }
    if (a) {
      const aMd = a.dataset.md || a.textContent.trim();
      fullMd += '\n\n## 답변\n\n' + aMd;
      // PDF·이메일은 렌더된 HTML을 쓴다. 접힌 <details>가 그대로 나가면 내용이
      // 빠진 것처럼 보이므로 사본에서 강제로 펼치고 목차는 뺀다(라이브 DOM 불변).
      // answerMd는 원문 마크다운이라 이 처리와 무관하다(복사·마크다운 저장 경로).
      const aHtml = window.answerGlance
        ? window.answerGlance.expandForExport(a.innerHTML)
        : a.innerHTML;
      fullHtml += '<div class="q">' + escHtml(lastQuestion || '') + '</div><div class="a">' + aHtml + '</div>';
    }
  });
  return { question: lastQuestion, answerMd: fullMd.trim(), answerHtml: fullHtml };
}

function actionCopy(btn) {
  const { answerMd } = getQAPair();
  const text = answerMd;
  navigator.clipboard.writeText(text).then(function() {
    btn.classList.add('done');
    btn.innerHTML = btn.innerHTML.replace('복사하기', '복사됨');
    setTimeout(function() {
      btn.classList.remove('done');
      btn.innerHTML = btn.innerHTML.replace('복사됨', '복사하기');
    }, 2000);
  });
}

function actionPDF() {
  const { answerHtml } = getQAPair();
  const win = window.open('', '_blank');
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<title>기초 노동상담</title>' +
    '<style>body{font-family:-apple-system,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;color:#111111;line-height:1.7;}' +
    'h1{font-size:20px;border-bottom:2px solid #111111;padding-bottom:8px;margin-bottom:16px;}' +
    '.q{background:#F5F5F5;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-weight:600;}' +
    '.a{font-size:15px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #D4D4D4;}' +
    'table{width:100%;border-collapse:collapse;margin:12px 0;}th,td{border:1px solid #D4D4D4;padding:6px 10px;text-align:left;}th{background:#111111;color:#FFFFFF;}' +
    'tr:nth-child(even) td{background:#F5F5F5;}td.num-cell{text-align:right;white-space:nowrap;}tr.total-row td{font-weight:700;background:#EAEAEA;}' +

// ── 이메일 전송 모달 (F-3: prompt() 연쇄 대신 인라인 모달 UX) ────────────────

let emailModalTargetBtn = null;
let emailModalToken = null;

function openEmailModal(btn) {
  emailModalTargetBtn = btn;
  emailModalToken = null;
  const overlay = document.getElementById('email-modal-overlay');
  const emailInput = document.getElementById('email-modal-input');
  const captchaInput = document.getElementById('email-modal-captcha-input');
  const captchaQ = document.getElementById('email-modal-captcha-q');
  const errorEl = document.getElementById('email-modal-error');
  const submitBtn = document.getElementById('email-modal-submit');

  emailInput.value = '';
  captchaInput.value = '';
  errorEl.textContent = '';
  captchaQ.textContent = '보안문자 로딩 중...';
  submitBtn.disabled = true;

  overlay.classList.add('open');
  emailInput.focus();

  fetch(API_BASE + '/api/captcha')
    .then(r => {
      // fetch는 4xx·5xx에 reject하지 않는다. 이 검사가 없으면 오류 응답 본문이
      // 정상 데이터로 흘러가 화면에 "보안문자: undefined"가 찍히고, 토큰 없이
      // 버튼만 열려 "눌리는데 아무 일도 안 나는" 상태가 된다.
      if (!r.ok) throw new Error('captcha ' + r.status);
      return r.json();
    })
    .then(data => {
      // 200인데 필드가 빠지는 경우(스키마 변경·프록시 개입)도 같은 증상을 만든다
      if (!data || !data.token || !data.question) throw new Error('captcha payload');
      emailModalToken = data.token;
      captchaQ.textContent = '보안문자: ' + data.question;
      submitBtn.disabled = false;
    })
    .catch(() => {
      // submitBtn은 위에서 이미 disabled=true — 실패 경로에서 열지 않는다
      captchaQ.textContent = '보안문자를 불러오지 못했습니다';
      errorEl.textContent = '일시적인 문제로 보안문자를 표시할 수 없습니다. 잠시 후 다시 시도해주세요.';
    });
}

function closeEmailModal() {
  document.getElementById('email-modal-overlay').classList.remove('open');
  emailModalTargetBtn = null;
}

function submitEmailModal() {
  const to = document.getElementById('email-modal-input').value.trim();
  const captchaAnswer = parseInt(document.getElementById('email-modal-captcha-input').value, 10);
  const errorEl = document.getElementById('email-modal-error');
  const submitBtn = document.getElementById('email-modal-submit');

  if (!to || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) {
    errorEl.textContent = '올바른 이메일 주소를 입력해주세요.';
    return;
  }
  if (!emailModalToken || isNaN(captchaAnswer)) {
    errorEl.textContent = '보안문자를 입력해주세요.';
    return;
  }

  const btn = emailModalTargetBtn;
  const { question, answerHtml } = getQAPair();
  const subject = '[기초 노동상담] ' + question.slice(0, 50);

  submitBtn.disabled = true;
  errorEl.textContent = '';

  fetch(API_BASE + '/api/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to, subject, body_html: answerHtml, captcha_token: emailModalToken, captcha_answer: captchaAnswer }),
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
  .then(function(res) {
    submitBtn.disabled = false;
    if (res.ok) {
      closeEmailModal();
      if (btn) {
        btn.classList.add('done');
        btn.innerHTML = btn.innerHTML.replace('이메일 전송', '전송 완료');
        setTimeout(function() {
          btn.classList.remove('done');
          btn.innerHTML = btn.innerHTML.replace('전송 완료', '이메일 전송');
        }, 2000);
      }
    } else {
      errorEl.textContent = res.data.detail || '전송 실패';
    }
  })
  .catch(function() {
    submitBtn.disabled = false;
    errorEl.textContent = '이메일 전송에 실패했습니다.';
  });
}

document.getElementById('email-modal-cancel').addEventListener('click', closeEmailModal);
document.getElementById('email-modal-submit').addEventListener('click', submitEmailModal);
document.getElementById('email-modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'email-modal-overlay') closeEmailModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('email-modal-overlay').classList.contains('open')) {
    closeEmailModal();
  }
});

// ── 전송 ─────────────────────────────────────────────────────────────────────

async function send() {
  const text = msgInput.value.trim();
  if (!text && pendingFiles.length === 0) return;

  expandChat();

  let displayHtml = text ? text.replace(/</g, '&lt;').replace(/\n/g, '<br>') : '';
  if (pendingFiles.length > 0) {
    const names = escHtml(pendingFiles.map(f => f.name).join(', '));  // \uD30C\uC77C\uBA85 XSS \uBC29\uC9C0
    if (displayHtml) displayHtml += '<br>';
    displayHtml += '<span style="font-size:var(--text-label);opacity:0.8">' + '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">' + '<path d="M21 11.5l-8.8 8.8a5 5 0 01-7.1-7.1l9-9a3.3 3.3 0 014.7 4.7l-9 9a1.7 1.7 0 01-2.4-2.4l8.3-8.3"/>' + '</svg> ' + names + '</span>';
  }
  addMsg('user', displayHtml);

  const attachments = [];
  for (const f of pendingFiles) {
    attachments.push({
      filename: f.name,
      content_type: guessMime(f),
      data: await fileToBase64(f),
    });
  }

  msgInput.value = '';
  msgInput.style.height = 'auto';
  pendingFiles = [];
  renderPreview();

  await doSend(text, attachments);
}

const SEND_TIMEOUT_MS = 60000; // 무활동(idle) 상한 — 이벤트 수신마다 리셋, 진행 중 응답은 유지하고 진짜 멈춤만 감지(F-2d)

async function doSend(text, attachments) {
  btn.disabled = true;
  const ctrl = new AbortController();
  let timeoutId = null;
  const resetIdleTimeout = () => {
    if (timeoutId) clearTimeout(timeoutId);
    timeoutId = setTimeout(() => ctrl.abort(), SEND_TIMEOUT_MS);
  };
  resetIdleTimeout();

  try {
    let resp;
    if (attachments.length > 0) {
      resp = await fetch(API_BASE + '/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_id: sessionId,
          attachments,
        }),
        signal: ctrl.signal,
      });
    } else {
      const params = new URLSearchParams({ message: text });
      if (sessionId) params.set('session_id', sessionId);
      resp = await fetch(API_BASE + '/api/chat/stream?' + params, { signal: ctrl.signal });
    }
    if (!resp.ok) {
      let detail = '';
      try { const body = await resp.json(); detail = body.detail || ''; } catch (_) {}
      throw new Error('서버 오류 (' + resp.status + ')' + (detail ? ': ' + detail : ''));
    }
    await readSSE(resp, resetIdleTimeout);
  } catch (e) {
    removeStatus();
    const timedOut = e.name === 'AbortError';
    const message = timedOut
      ? '응답 시간이 초과되었습니다. 네트워크 상태를 확인 후 다시 시도해주세요.'
      : ('오류가 발생했습니다: ' + e.message);
    addErrorWithRetry(message, text, attachments);
  } finally {
    clearTimeout(timeoutId);
    removeStatus();
    btn.disabled = false;
    msgInput.focus();
  }
}

function addErrorWithRetry(message, text, attachments) {
  const el = addMsg('assistant', escHtml(message));
  const retryBtn = document.createElement('button');
  retryBtn.className = 'retry-btn';
  retryBtn.textContent = '다시 시도';
  retryBtn.addEventListener('click', () => {
    retryBtn.disabled = true;
    doSend(text, attachments);
  });
  el.appendChild(document.createElement('br'));
  el.appendChild(retryBtn);
}

      document.querySelectorAll('.faq-tab').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });

// ── Board ────────────────────────────────────────────────────────────────────

let boardPage = 1;
let boardLoading = false;

function getTimeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '방금 전';
  if (mins < 60) return mins + '분 전';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '시간 전';
  const days = Math.floor(hours / 24);
  if (days < 30) return days + '일 전';
  return new Date(isoStr).toLocaleDateString('ko-KR');
}

async function loadBoard(append) {
  if (boardLoading) return;
  boardLoading = true;

  const moreBtn = document.getElementById('board-more-btn');
  moreBtn.textContent = '불러오는 중...';

  try {
    const resp = await fetch(API_BASE + '/api/board/recent?page=' + boardPage + '&per_page=10');
    if (!resp.ok) throw new Error('API error');
    const data = await resp.json();

    const list = document.getElementById('board-list');
    if (!append) list.innerHTML = '';

    data.items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'board-item';
      const timeAgo = getTimeAgo(item.created_at);
      const qText = escHtml(item.question);
      const aText = escHtml(item.answer_preview);
      div.innerHTML =
        '<div class="board-q" role="button" tabindex="0" aria-expanded="false">' +
          '<span class="board-cat">' + escHtml(item.category || '일반') + '</span>' +
          '<span class="board-text">' + qText + '</span>' +
          '<span class="board-time">' + timeAgo + '</span>' +
          '<span class="board-chevron">\u25BC</span>' +
        '</div>' +
        '<div class="board-a">' +
          aText +
          '<br><button class="board-ask-btn">비슷한 질문하기 \u2192</button>' +
        '</div>';
      // 인라인 onclick 문자열 조립 대신 addEventListener + 원문 그대로 전달
      // — HTML 속성 이탈(quote-breakout) 인젝션 벡터를 원천 차단(F-2b)
      const qDiv = div.querySelector('.board-q');
      const toggleOpen = () => {
        const open = div.classList.toggle('open');
        qDiv.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      qDiv.addEventListener('click', toggleOpen);
      qDiv.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleOpen(); }
      });
      div.querySelector('.board-ask-btn').addEventListener('click', () => askQuestion(item.question));
      list.appendChild(div);
    });

    moreBtn.style.display = data.has_more ? '' : 'none';
    moreBtn.textContent = '더 보기 \u2193';
  } catch (e) {
    console.error('Board load error:', e);
    if (!append) {
      document.getElementById('board-list').innerHTML =
        '<p style="text-align:center;color:var(--color-text-muted);padding:20px;">질문을 불러올 수 없습니다.</p>';
    }
    moreBtn.style.display = 'none';
  } finally {
    boardLoading = false;
  }
}

document.getElementById('board-more-btn').addEventListener('click', () => {
  boardPage++;
  loadBoard(true);
});

const boardObserver = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && !boardLoading) {
    loadBoard(false);
    boardObserver.disconnect();
  }
}, { rootMargin: '200px' });
boardObserver.observe(document.getElementById('board-section'));

<script>
// ── 공지사항 배너 ────────────────────────────────────────────────────────────
// /notice.json 을 읽어 표시 기간에 해당하는 첫 공지 하나를 띄운다.
// 파일이 없거나 파싱에 실패하면 조용히 건너뛴다(상담 기능에 영향 없음).
(function initNotice() {
  const KEY = 'dismissedNotices';
  const el = document.getElementById('notice-banner');
  if (!el) return;

  const dismissed = () => {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  };
  const inPeriod = (n, today) =>
    (!n.startsAt || n.startsAt <= today) && (!n.endsAt || n.endsAt >= today);

  fetch('/notice.json', { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : null))
    .then(data => {
      const list = data && Array.isArray(data.notices) ? data.notices : [];
      const today = new Date().toISOString().slice(0, 10);
      const seen = dismissed();
      const n = list.find(x => x && x.id && x.message && inPeriod(x, today) && !seen.includes(x.id));
      if (!n) return;

      const esc = s => String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const icon = n.level === 'warn'
        ? '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4L2.5 20h19z"/><path d="M12 10v4M12 17.2v.1"/></svg>'
        : '<svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 001 1h3l5 4V6L7 10H4a1 1 0 00-1 1z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>';
      let html = `<span class="notice-icon" aria-hidden="true">${icon}</span>`
               + `<span class="notice-body">${esc(n.message)}`;
      // 링크는 사이트 내부 경로만 허용 — notice.json이 오염돼도 외부로 유도되지 않게.
      // 정규식(`/^\/[^/]/`)으로는 부족하다: `/\evil.com` 은 통과하는데 브라우저의
      // URL 파서가 특수 스킴에서 백슬래시를 슬래시로 정규화해 https://evil.com 이 된다.
      // 실제 파서로 해석한 origin을 비교해야 한다.
      let safeLink = null;
      if (n.linkUrl) {
        try {
          const u = new URL(n.linkUrl, location.origin);
          if (u.origin === location.origin) safeLink = u.pathname + u.search + u.hash;
        } catch { /* 해석 불가 → 링크 생략 */ }
      }
      if (safeLink) {
        html += `<a class="notice-link" href="${esc(safeLink)}">${esc(n.linkText || '자세히 보기')}</a>`;
      }
      html += '</span>';
      if (n.dismissible !== false) {
        html += '<button type="button" class="notice-close" aria-label="공지 닫기">&times;</button>';
      }

      el.className = 'level-' + (n.level === 'warn' ? 'warn' : 'info');
      el.innerHTML = html;
      el.hidden = false;

      const closeBtn = el.querySelector('.notice-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          el.hidden = true;
          try { localStorage.setItem(KEY, JSON.stringify([...seen, n.id].slice(-20))); } catch {}
        });
      }
    })
    .catch(() => {});
})();

// PWA 등록·설치 프롬프트는 /pwa.js 로 분리했다 — board·calculators 도 같은 파일을 쓴다.
// 목차·접기 적용. 게시판 화면과 같은 규칙을 공유한다.
</script>
