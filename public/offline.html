<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오프라인 — 기초 노동상담</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/tokens.css">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  body {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: var(--space-3);
  }
  .mark { width: 72px; height: 72px; margin-bottom: var(--space-3); }
  h1 { font-size: var(--text-h2); margin-bottom: var(--space-1); }
  p { color: var(--color-text-muted); max-width: 380px; }
  .actions {
    margin-top: var(--space-3);
    display: flex; gap: var(--space-1);
    flex-wrap: wrap; justify-content: center;
  }
</style>
</head>
<body>
  <img class="mark" src="/favicon.svg" alt="" aria-hidden="true">
  <h1>지금은 연결이 끊겨 있습니다</h1>
  <p>이 화면은 저장된 사본으로 열렸습니다. AI 상담과 검색은 인터넷 연결이 필요합니다. 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <div class="actions">
    <button type="button" class="btn" onclick="location.reload()">다시 시도</button>
    <a class="btn btn-secondary" href="/">첫 화면으로</a>
  </div>
</body>
</html>
