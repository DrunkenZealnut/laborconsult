<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>AI 노동상담 관리자</title>
<link rel="stylesheet" href="/tokens.css">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { min-height: 100vh; }

  /* Header */
  header { background: var(--color-surface); border-bottom: 1px solid var(--color-border); padding: 12px var(--space-3); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  header h1 { font-size: var(--text-h3); font-weight: 700; }
  .nav-links { display: flex; gap: var(--space-1); align-items: center; }
  .nav-links button { background: none; border: 1px solid var(--color-border); border-radius: var(--radius); padding: 6px 14px; font-size: var(--text-label); cursor: pointer; color: var(--color-text); }
  .nav-links button:hover { border-color: var(--accent); color: var(--color-text); }
  .nav-links button.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .nav-links .logout { color: var(--color-text); border-color: var(--color-text); }
  .nav-links .logout:hover { background: var(--color-text); color: var(--color-bg); }

  /* Login */
  #login-view { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 52px); }
  .login-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: var(--space-4); width: 360px; text-align: center; }
  .login-card h2 { font-size: var(--text-h2); margin-bottom: 20px; }
  .login-card input { width: 100%; padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: var(--text-sm); margin-bottom: 12px; outline: none; }
  .login-card input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .login-card button { width: 100%; padding: 10px; background: var(--accent); color: var(--accent-on); border: none; border-radius: var(--radius); font-size: var(--text-sm); cursor: pointer; }
  .login-card button:hover { opacity: 0.9; }
  .login-error { color: var(--color-text); font-size: var(--text-label); margin-bottom: var(--space-1); min-height: 20px; }

  /* Dashboard */
  .container { max-width: var(--container-max); margin: 0 auto; padding: 20px var(--space-3); }
  .stat-cards { display: grid; grid-template-columns: repeat(var(--grid-columns), 1fr); gap: var(--grid-gap); margin-bottom: var(--space-3); }
  .stat-card { grid-column: span 3; }
  .stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: var(--space-2) 20px; }
  .stat-card .label { font-size: var(--text-label); color: var(--color-text-muted); margin-bottom: var(--space-half); }
  .stat-card .value { font-size: var(--text-h2); font-weight: 700; }
  .charts { display: grid; grid-template-columns: repeat(var(--grid-columns), 1fr); gap: var(--grid-gap); margin-bottom: var(--space-3); }
  .charts > :first-child { grid-column: span 8; }
  .charts > :last-child  { grid-column: span 4; }
  .chart-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: var(--space-2) 20px; }
  .chart-card h3 { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: 12px; }
  @media (max-width: 768px) {
    .stat-cards, .charts { grid-template-columns: 1fr; }
    .stat-card, .charts > :first-child, .charts > :last-child { grid-column: auto; }
  }

  /* Conversations */
  .filters { display: flex; gap: var(--space-1); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .filters input, .filters select { padding: var(--space-1) 12px; border: 1px solid var(--color-border); border-radius: var(--radius); font-size: var(--text-label); outline: none; }
  .filters input:focus, .filters select:focus { border-color: var(--accent); }
  .filters input[type="text"] { flex: 1; min-width: 200px; }
  .conv-list { display: flex; flex-direction: column; gap: var(--space-1); }
  .conv-item { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 12px var(--space-2); cursor: pointer; }
  .conv-item:hover { border-color: var(--accent); }
  .conv-item .conv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .conv-item .conv-cat { display: inline-block; padding: 2px var(--space-1); border-radius: var(--radius); font-size: var(--text-label); font-weight: 600; background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }
  .conv-item .conv-date { font-size: var(--text-label); color: var(--color-text-muted); }
  .conv-item .conv-question { font-size: var(--text-sm); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: var(--space-2); }
  .pagination button { padding: 6px 14px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); cursor: pointer; font-size: var(--text-label); }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination span { font-size: var(--text-label); color: var(--color-text-muted); }
  .empty-state { text-align: center; padding: 40px; color: var(--color-text-muted); }

  /* Detail Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--color-surface); border-radius: var(--radius); width: 100%; max-width: 720px; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-2) 20px; border-bottom: 1px solid var(--color-border); position: sticky; top: 0; background: var(--color-surface); border-radius: var(--radius) 12px 0 0; z-index: 1; }
  .modal-header h2 { font-size: var(--text-body); }
  .modal-close { background: none; border: none; font-size: var(--text-h2); cursor: pointer; color: var(--color-text-muted); padding: var(--space-half) var(--space-1); }
  .modal-close:hover { color: var(--color-text); }
  .modal-body { padding: 20px; }
  .detail-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: var(--space-2); }
  .detail-meta span { font-size: var(--text-label); color: var(--color-text-muted); background: var(--color-bg); padding: var(--space-half) 10px; border-radius: var(--radius); }
  .detail-section { margin-bottom: var(--space-2); }
  .detail-section h4 { font-size: var(--text-label); color: var(--color-text-muted); margin-bottom: var(--space-1); display: flex; align-items: center; gap: 6px; }
  .detail-question { background: var(--accent); color: var(--accent-on); padding: 12px var(--space-2); border-radius: var(--radius); font-size: var(--text-sm); line-height: 1.6; }
  .detail-answer { background: var(--color-bg); border: 1px solid var(--color-border); padding: 14px var(--space-2); border-radius: var(--radius); font-size: var(--text-sm); line-height: 1.7; }
  .detail-answer h2 { font-size: var(--text-body); margin: 14px 0 6px; }
  .detail-answer h3 { font-size: var(--text-sm); margin: 10px 0 var(--space-half); }
  .detail-answer p { margin: 6px 0; }
  .detail-answer ul, .detail-answer ol { margin: 6px 0 6px 20px; }
  .detail-answer table { border-collapse: collapse; margin: var(--space-1) 0; font-size: var(--text-label); }
  .detail-answer th, .detail-answer td { border: 1px solid var(--color-border); padding: 6px 10px; text-align: left; }
  .detail-answer th { background: var(--color-bg); font-weight: 600; }
  .detail-answer code { background: var(--color-surface); padding: 1px var(--space-half); border-radius: var(--radius); font-size: var(--text-label); }
  .detail-answer pre { background: var(--color-surface); padding: 10px; border-radius: var(--radius); overflow-x: auto; margin: var(--space-1) 0; }
  .detail-answer strong { font-weight: 600; }
  .detail-answer blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--color-text-muted); margin: 6px 0; }
  .attachment-list { display: flex; flex-direction: column; gap: 6px; }
  .attachment-item { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-1) 12px; background: var(--color-bg); border-radius: var(--radius); font-size: var(--text-label); }
  .attachment-item a { color: var(--color-text); text-decoration: none; }
  .attachment-item a:hover { text-decoration: underline; }
  .attachment-item .file-size { color: var(--color-text-muted); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>AI 노동상담 관리자</h1>
  <div class="nav-links hidden" id="nav">
    <button id="nav-dashboard" class="active" onclick="showView('dashboard')">대시보드</button>
    <button id="nav-conversations" onclick="showView('conversations')">대화목록</button>
    <button class="logout" onclick="logout()">로그아웃</button>
  </div>
</header>

<!-- Login View -->
<div id="login-view">
  <div class="login-card">
    <h2>관리자 로그인</h2>
    <div class="login-error" id="login-error"></div>
    <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password">
    <button onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- Dashboard View -->
<div id="dashboard-view" class="container hidden">
  <div class="stat-cards" id="stat-cards"></div>
  <div class="charts">
    <div class="chart-card">
      <h3>일별 상담 추이 (최근 30일)</h3>
      <canvas id="daily-chart"></canvas>
    </div>
    <div class="chart-card">
      <h3>카테고리 분포</h3>
      <canvas id="category-chart"></canvas>
    </div>
  </div>
</div>

<!-- Conversations View -->
<div id="conversations-view" class="container hidden">
  <div class="filters">
    <input type="text" id="filter-search" placeholder="키워드 검색..." onkeydown="if(event.key==='Enter')loadConversations(1)">
    <select id="filter-category" onchange="loadConversations(1)">
      <option value="">전체 카테고리</option>
    </select>
    <input type="date" id="filter-from" onchange="loadConversations(1)">
    <input type="date" id="filter-to" onchange="loadConversations(1)">
    <button onclick="loadConversations(1)" style="padding:8px 16px;background:var(--accent);color:var(--accent-on);border:none;border-radius:6px;cursor:pointer;font-size:13px;">검색</button>
  </div>
  <div class="conv-list" id="conv-list"></div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>대화 상세</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
  // 차트가 현재 테마의 토큰 값을 따르도록 읽어 온다
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
const _API_BASE = location.hostname.includes('github.io')
  ? 'https://laborconsult.vercel.app'
  : '';
const API = _API_BASE + '/api/admin';
let token = localStorage.getItem('admin_token');
let dailyChart = null;
let categoryChart = null;
let currentPage = 1;
let categories = [];

// ── Auth ──────────────────────────────────────────────────────────────────────

if (token) {
  showApp();
} else {
  document.getElementById('login-pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const resp = await fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      errEl.textContent = err.detail || '로그인 실패';
      return;
    }
    const data = await resp.json();
    token = data.token;
    localStorage.setItem('admin_token', token);
    showApp();
  } catch (e) {
    errEl.textContent = '서버에 연결할 수 없습니다';
  }
}

function logout() {
  token = null;
  localStorage.removeItem('admin_token');
  location.reload();
}

function showApp() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('nav').classList.remove('hidden');
  showView('dashboard');
}

// ── Fetch Helper ──────────────────────────────────────────────────────────────

async function adminFetch(url) {
  const resp = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  if (resp.status === 401) {
    logout();
    return null;
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    alert(err.detail || '오류가 발생했습니다');
    return null;
  }
  return resp.json();
}

// ── Views ─────────────────────────────────────────────────────────────────────

function showView(view) {
  document.getElementById('dashboard-view').classList.toggle('hidden', view !== 'dashboard');
  document.getElementById('conversations-view').classList.toggle('hidden', view !== 'conversations');
  document.getElementById('nav-dashboard').classList.toggle('active', view === 'dashboard');
  document.getElementById('nav-conversations').classList.toggle('active', view === 'conversations');

  if (view === 'dashboard') loadStats();
  if (view === 'conversations') loadConversations(1);
}

// ── Dashboard ─────────────────────────────────────────────────────────────────

async function loadStats() {
  const data = await adminFetch(API + '/stats');
  if (!data) return;

  const avg = data.daily_counts.length > 0
    ? Math.round(data.daily_counts.reduce((s, d) => s + d.count, 0) / data.daily_counts.length)
    : 0;

  document.getElementById('stat-cards').innerHTML = [
    { label: '총 상담', value: data.total_conversations.toLocaleString() },
    { label: '오늘 상담', value: data.today_conversations.toLocaleString() },
    { label: '총 세션', value: data.total_sessions.toLocaleString() },
    { label: '일 평균', value: avg.toLocaleString() },
  ].map(s => `<div class="stat-card"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`).join('');

  // 카테고리 목록 저장 (필터용)
  categories = data.category_counts.map(c => c.category);
  const sel = document.getElementById('filter-category');
  sel.innerHTML = '<option value="">전체 카테고리</option>' +
    categories.map(c => `<option value="${c}">${c}</option>`).join('');

  // 일별 차트
  const dailyCtx = document.getElementById('daily-chart').getContext('2d');
  if (dailyChart) dailyChart.destroy();
  dailyChart = new Chart(dailyCtx, {
    type: 'bar',
    data: {
      labels: data.daily_counts.map(d => d.date.slice(5)),
      datasets: [{
        label: '상담 건수',
        data: data.daily_counts.map(d => d.count),
        backgroundColor: cssVar('--accent'),
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
    },
  });

  // 카테고리 차트
  const catCtx = document.getElementById('category-chart').getContext('2d');
  if (categoryChart) categoryChart.destroy();
  const colors = ['#185FA5','#0F6E56','#854F0B','#993C1D','#534AB7','#5F5E5A','#3D7CB8','#2E8B6F','#A6741F','#B25537','#6F66C9','#807E79'];
  categoryChart = new Chart(catCtx, {
    type: 'doughnut',
    data: {
      labels: data.category_counts.map(c => c.category),
      datasets: [{
        data: data.category_counts.map(c => c.count),
        backgroundColor: data.category_counts.map((_, i) => colors[i % colors.length]),
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
      },
    },
  });
}

// ── Conversations ─────────────────────────────────────────────────────────────

async function loadConversations(page) {
  currentPage = page;
  const search = document.getElementById('filter-search').value;
  const category = document.getElementById('filter-category').value;
  const dateFrom = document.getElementById('filter-from').value;
  const dateTo = document.getElementById('filter-to').value;

  const params = new URLSearchParams({ page, per_page: 20 });
  if (search) params.set('search', search);
  if (category) params.set('category', category);
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);

  const data = await adminFetch(API + '/conversations?' + params);
  if (!data) return;

  const list = document.getElementById('conv-list');
  if (data.conversations.length === 0) {
    list.innerHTML = '<div class="empty-state">검색 결과가 없습니다</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  list.innerHTML = data.conversations.map(c => {
    const dt = new Date(c.created_at);
    const dateStr = dt.toLocaleDateString('ko-KR') + ' ' + dt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return `<div class="conv-item" onclick="openDetail('${c.id}')">
      <div class="conv-header">
        <span class="conv-cat">${c.category}</span>
        <span class="conv-date">${dateStr}</span>
      </div>
      <div class="conv-question">${escapeHtml(c.question_text)}</div>
    </div>`;
  }).join('');

  const pag = document.getElementById('pagination');
  pag.innerHTML = `
    <button onclick="loadConversations(${page - 1})" ${page <= 1 ? 'disabled' : ''}>이전</button>
    <span>${page} / ${data.pages} 페이지 (${data.total}건)</span>
    <button onclick="loadConversations(${page + 1})" ${page >= data.pages ? 'disabled' : ''}>다음</button>
  `;
}

// ── Detail Modal ──────────────────────────────────────────────────────────────

async function openDetail(id) {
  const data = await adminFetch(API + '/conversations/' + id);
  if (!data) return;

  const dt = new Date(data.created_at);
  const dateStr = dt.toLocaleDateString('ko-KR') + ' ' + dt.toLocaleTimeString('ko-KR');

  let html = `
    <div class="detail-meta">
      <span>${data.category}</span>
      <span>${dateStr}</span>
      ${(data.calculation_types || []).map(t => `<span>${t}</span>`).join('')}
      <span>세션: ${(data.session_id || '').slice(0, 8)}...</span>
    </div>
    <div class="detail-section">
      <h4>질문</h4>
      <div class="detail-question">${escapeHtml(data.question_text).replace(/\n/g, '<br>')}</div>
    </div>
    <div class="detail-section">
      <h4>답변</h4>
      <div class="detail-answer">${md(data.answer_text || '')}</div>
    </div>
  `;

  if (data.attachments && data.attachments.length > 0) {
    html += `<div class="detail-section"><h4>첨부파일</h4><div class="attachment-list">`;
    for (const att of data.attachments) {
      const size = att.file_size > 1024*1024
        ? (att.file_size / 1024 / 1024).toFixed(1) + 'MB'
        : (att.file_size / 1024).toFixed(0) + 'KB';
      // 버킷이 비공개라 URL은 조회 시점에 발급된 1시간 만료 signed URL이다.
      // 발급 실패 시 null로 내려오므로 링크 대신 안내 문구를 보여준다.
      const label = escapeHtml(att.filename);
      const link = att.public_url
        ? `<a href="${escapeHtml(att.public_url)}" target="_blank" rel="noopener">${label}</a>`
        : `<span>${label}</span> <span class="file-size">— 링크 발급 실패</span>`;
      html += `<div class="attachment-item">
        ${link}
        <span class="file-size">(${size})</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('detail-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Markdown Renderer ─────────────────────────────────────────────────────────

function escapeHtml(text) {
  return (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function md(text) {
  if (!text) return '';
  const blocks = [];
  function stash(html) { blocks.push(html); return '\x00B' + (blocks.length - 1) + '\x00'; }

  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    stash('<pre><code>' + escapeHtml(code) + '</code></pre>')
  );

  text = text.replace(/((?:^\|.+\|[ \t]*$\n?)+)/gm, block => {
    const rows = block.trim().split('\n');
    let html = '<table>';
    let headerDone = false;
    for (const row of rows) {
      if (/^\|[\s:|-]+\|$/.test(row.trim())) { headerDone = true; continue; }
      const cells = row.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const tag = !headerDone ? 'th' : 'td';
      html += '<tr>' + cells.map(c => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>';
      if (!headerDone) headerDone = true;
    }
    html += '</table>';
    return stash(html);
  });

  text = text.replace(/((?:^[ \t]*[-*] .+$\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[ \t]*[-*] /, '') + '</li>');
    return stash('<ul>' + items.join('') + '</ul>');
  });
  text = text.replace(/((?:^[ \t]*\d+\. .+$\n?)+)/gm, block => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[ \t]*\d+\. /, '') + '</li>');
    return stash('<ol>' + items.join('') + '</ol>');
  });

  let html = text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^---$/gm, '<hr>');

  html = html.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
  html = html.replace(/\x00B(\d+)\x00/g, (_, i) => '</p>' + blocks[+i] + '<p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}
</script>
</body>
</html>
