<style>
  body { min-height: 100dvh; max-width: var(--reading-max); margin: 0 auto; }

  /* ── HEADER ── */
  #site-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--color-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--color-border);
    padding: max(10px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
  }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .header-logo { font-family: var(--font-body); font-weight: var(--weight-bold); font-size: var(--text-h2); color: var(--color-text); text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0; }
  .header-logo span { color: var(--color-text); }
  .header-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .header-nav a {
    font-family: var(--font-body); font-size: var(--text-label); color: var(--color-text-muted);
    text-decoration: none; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    padding: 6px 14px; background: transparent; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); white-space: nowrap;
  }
  .header-nav a:hover { border-color: var(--accent); color: var(--color-text); }
  .header-nav a.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

  /* ── HERO ── */
  #board-hero {
    background: var(--color-surface); border: 1px solid var(--color-border);
    padding: var(--space-4) var(--space-3); border-radius: var(--radius); text-align: center;
  }
  #board-hero h1 { font-size: var(--text-h1); font-weight: var(--weight-bold); }
  #board-hero h1 em { font-style: normal; text-decoration: underline;
                      text-decoration-thickness: 3px; text-underline-offset: 0.15em; }
  #board-hero p { color: var(--color-text-muted); font-size: var(--text-body); margin-top: var(--space-1); }
  #board-stats { color: var(--color-text-muted); font-size: var(--text-sm); margin-top: var(--space-2); }
  #board-stats strong { font-weight: var(--weight-bold); font-size: var(--text-h3); }

  /* ── SEARCH ── */
  #search-section { padding: var(--space-3) 20px 0; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }
  #search-input {
    width: 100%; padding: 14px 20px 14px 44px;
    border: 1px solid var(--color-border); border-radius: var(--radius);
    background: var(--color-surface); font-size: var(--text-sm); font-family: var(--font-body);
    color: var(--color-text); outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--color-text-muted); }

  /* ── CATEGORY CHIPS ── */
  #filter-section { padding: var(--space-2) 20px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #filter-section::-webkit-scrollbar { display: none; }
  #category-chips { display: flex; gap: var(--space-1); flex-wrap: nowrap; }
  .cat-chip {
    padding: 7px var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    background: transparent; font-size: var(--text-label); font-family: var(--font-body);
    color: var(--color-text-muted); cursor: pointer; white-space: nowrap;
    transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); flex-shrink: 0;
  }
  .cat-chip:hover { border-color: var(--accent); color: var(--color-text); }
  .cat-chip.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

  /* ── BOARD LIST ── */
  #board-section { padding: var(--space-2) 20px 0; }
  #result-info { font-size: var(--text-label); color: var(--color-text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .board-item {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); margin-bottom: var(--space-1); overflow: hidden; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .board-item:hover { border-color: var(--accent); box-shadow: var(--shadow-card); }
  .board-q {
    padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: var(--text-sm);
  }
  .board-cat {
    background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border);
    font-size: var(--text-label); font-weight: var(--weight-semibold); padding: 3px 10px;
    border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0;
  }
  .board-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-time { color: var(--color-text-muted); font-size: var(--text-label); white-space: nowrap; flex-shrink: 0; }
  .board-chevron { color: var(--color-text-muted); flex-shrink: 0; font-size: var(--text-label); }

  /* ── DETAIL VIEW ── */
  #detail-view { display: none; padding: 0 20px var(--space-4); }
  #detail-view.active { display: block; }
  .detail-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 0; font-size: var(--text-sm); color: var(--color-text); font-weight: var(--weight-semibold);
    cursor: pointer; background: none; border: none; font-family: var(--font-body);
  }
  .detail-back:hover { text-decoration: underline; }
  .detail-meta {
    display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap;
    margin-bottom: var(--space-2); font-size: var(--text-label); color: var(--color-text-muted);
  }

  /* Chat bubbles */
  .chat-area { display: flex; flex-direction: column; gap: 12px; }
  .msg-wrap { display: flex; flex-direction: column; }
  .msg-wrap.user-side { align-items: flex-end; }
  .msg-wrap.bot-side { align-items: flex-start; }
  .msg-bubble {
    max-width: 85%; padding: 14px 18px; border-radius: 14px;
    font-size: var(--text-sm); line-height: var(--leading-relaxed); word-break: break-word;
  }
  .msg-bubble.user {
    background: var(--color-text); color: var(--color-bg); border-bottom-right-radius: 4px;
  }
  .msg-bubble.bot {
    background: var(--color-surface); border: 1px solid var(--color-border); border-bottom-left-radius: 4px;
  }
  .msg-bubble.bot :first-child { margin-top: 0; }
  .msg-bubble.bot h2 { font-size: var(--text-body); margin: 14px 0 6px; }
  .msg-bubble.bot h3 { font-size: var(--text-sm); margin: 10px 0 var(--space-half); }
  .msg-bubble.bot p { margin: 6px 0; }
  .msg-bubble.bot ul, .msg-bubble.bot ol { margin: 6px 0 6px 20px; }
  .msg-bubble.bot table { border-collapse: collapse; margin: 10px 0; font-size: var(--text-sm); width: auto; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid var(--color-border); }
  .msg-bubble.bot th { background: var(--color-text); color: var(--color-bg); font-weight: var(--weight-semibold); padding: var(--space-1) 14px; text-align: left; white-space: nowrap; border: none; border-bottom: 2px solid var(--color-surface); }
  .msg-bubble.bot td { padding: 7px 14px; text-align: left; white-space: nowrap; border: none; border-bottom: 1px solid var(--color-border); }
  .msg-bubble.bot tr:nth-child(even) td { background: var(--color-bg); }
  .msg-bubble.bot tr:last-child td { border-bottom: none; }
  .msg-bubble.bot strong { font-weight: var(--weight-semibold); color: var(--color-text); }
  .msg-bubble.bot blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--color-text-muted); margin: 6px 0; }
  .msg-bubble.bot code { background: var(--color-bg); padding: 1px var(--space-half); border-radius: 3px; font-size: var(--text-label); }
  .msg-bubble.bot pre { background: var(--color-bg); padding: 10px; border-radius: 6px; overflow-x: auto; margin: var(--space-1) 0; }
  .msg-bubble.bot pre code { background: none; padding: 0; }
  .msg-bubble.bot hr { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }

  /* 답변 상단 목차와 접기 UI. 선택자는 .msg-bubble.bot 기준이다.
     게시판은 요약 배지 클래스가 없으므로 heading 텍스트만으로 동작해야 한다. */
  .answer-outline { position: sticky; top: 8px; z-index: 4; display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding: var(--space-1) 0; background: var(--color-bg); border-bottom: 1px solid var(--color-border); scrollbar-width: none; }
  .answer-outline::-webkit-scrollbar { display: none; }
  .outline-chip { flex: 0 0 auto; max-width: 160px; min-height: 32px; display: inline-flex; align-items: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: var(--space-half) 10px; border: 1px solid var(--color-border); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text-muted); font-size: var(--text-label); text-decoration: none; line-height: var(--leading-normal); }
  .outline-chip:hover { color: var(--color-text); border-color: var(--color-text-muted); }
  .outline-chip:focus-visible { outline: 2px solid var(--color-text-muted); outline-offset: 2px; }
  .msg-bubble.bot details { margin: 10px 0; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }
  /* 터치 타겟 44px 확보 */
  .msg-bubble.bot details > summary { cursor: pointer; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text); line-height: var(--leading-base); list-style: none; }
  .msg-bubble.bot details > summary::-webkit-details-marker { display: none; }
  .msg-bubble.bot details > summary::before { content: '▸'; flex: 0 0 auto; color: var(--color-text); transition: transform 0.15s; }
  .msg-bubble.bot details[open] > summary::before { transform: rotate(90deg); }
  .msg-bubble.bot details > summary:focus-visible { outline: 2px solid var(--color-text-muted); outline-offset: -2px; }
  .msg-bubble.bot details > *:not(summary) { margin-left: 14px; margin-right: 14px; }
  .msg-bubble.bot details > *:last-child { margin-bottom: 12px; }
  /* opacity만으로 숨기면 보이지 않는 채 탭 순서에 남는다 */
  #glance-jump-core { position: fixed; bottom: 24px; right: 24px; z-index: 90; padding: var(--space-1) 14px; min-height: 44px; border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border); box-shadow: var(--shadow-lift); cursor: pointer; font-size: var(--text-label); font-weight: var(--weight-semibold); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out); }
  #glance-jump-core.show { opacity: 1; visibility: visible; pointer-events: auto; }
  #glance-jump-core:hover { border-color: var(--color-text-muted); }
  .msg-label { font-size: var(--text-label); color: var(--color-text-muted); margin-bottom: var(--space-half); padding: 0 var(--space-half); }
  .no-answer { color: var(--color-text-muted); font-size: var(--text-sm); padding: 20px 0; text-align: center; }

  .detail-actions {
    display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; margin-top: var(--space-2);
  }
  .board-ask-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--color-text); font-size: var(--text-label); font-weight: var(--weight-semibold); cursor: pointer;
    background: rgba(var(--accent-rgb), 0.08); border: 1px solid rgba(var(--accent-rgb), 0.2);
    border-radius: var(--radius-pill); padding: var(--space-1) 18px;
    font-family: var(--font-body); transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); text-decoration: none;
  }
  .board-ask-btn:hover { background: rgba(var(--accent-rgb), 0.15); }

  /* ── PAGINATION ── */
  #pagination {
    display: flex; justify-content: center; align-items: center; gap: var(--space-half);
    padding: var(--space-4) 20px var(--space-2);
  }
  .page-btn {
    min-width: 36px; height: 36px; border: 1px solid var(--color-border); border-radius: var(--radius);
    background: var(--color-surface); font-size: var(--text-sm); font-family: var(--font-body);
    color: var(--color-text-muted); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
    display: flex; align-items: center; justify-content: center;
  }
  .page-btn:hover:not(:disabled):not(.active) { border-color: var(--accent); color: var(--color-text); }
  .page-btn.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: var(--space-6) 20px; color: var(--color-text-muted); }
  .empty-state svg { margin-bottom: var(--space-2); }
  .empty-state p { font-size: var(--text-sm); }
  .empty-state .empty-sub { font-size: var(--text-label); margin-top: var(--space-1); }

  /* ── LOADING ── */
  .loading-skeleton { padding: 20px; }
  .skeleton-item {
    background: var(--color-surface); animation: pulse 1.5s ease-in-out infinite;
    height: 56px; border-radius: var(--radius); margin-bottom: var(--space-1);
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ── FOOTER ── */
  #site-footer {
    background: var(--color-surface); color: var(--color-text-muted); padding: 12px var(--space-3);
    font-size: var(--text-label); line-height: var(--leading-relaxed); border-radius: var(--radius) var(--radius) 0 0;
    margin-top: var(--space-4);
  }
  .footer-inner { max-width: 800px; margin: 0 auto; text-align: center; }
  .footer-org { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--space-1); }
  .footer-org strong { color: var(--color-text); font-family: var(--font-body); font-size: var(--text-body); }
  .footer-org a { color: var(--color-text-muted); text-decoration: none; }
  .footer-org a:hover { text-decoration: underline; }
  .footer-links { display: flex; gap: var(--space-1); justify-content: center; }
  .footer-links a { color: var(--color-text-muted); text-decoration: none; }
  .footer-links a:hover { color: var(--color-text); }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    #board-hero { padding: var(--space-4) 20px var(--space-3); }
    #board-hero h1 { font-size: var(--text-h2); }
    .board-q { padding: 12px 14px; font-size: var(--text-label); gap: var(--space-1); }
    .board-cat { font-size: var(--text-label); padding: 2px var(--space-1); }
    .board-time { display: none; }
    .md-content { font-size: var(--text-label); }
    .outline-chip { max-width: 128px; font-size: var(--text-label); }
    #glance-jump-core { bottom: 16px; right: 16px; padding: 6px 12px; font-size: var(--text-label); }
  }

  /* ── WRITE BUTTON ── */
  .write-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: var(--space-1) 18px; border: 1px solid var(--accent); border-radius: var(--radius-pill);
    background: var(--accent); color: var(--accent-on); font-size: var(--text-label); font-weight: var(--weight-semibold);
    font-family: var(--font-body); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); white-space: nowrap;
  }
  .write-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    justify-content: center; align-items: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--color-surface); border-radius: var(--radius);
    width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 28px var(--space-3);
    position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: none; border: none;
    font-size: var(--text-h2); color: var(--color-text-muted); cursor: pointer; line-height: var(--leading-none);
  }
  .modal-close:hover { color: var(--color-text); }
  .modal-title {
    font-family: var(--font-body); font-size: var(--text-h2); font-weight: var(--weight-bold);
    color: var(--color-text); margin-bottom: 20px;
  }
  .form-group { margin-bottom: var(--space-2); }
  .form-label {
    display: block; font-size: var(--text-label); font-weight: var(--weight-semibold); color: var(--color-text);
    margin-bottom: 6px;
  }
  .form-label .required { color: var(--color-text); margin-left: 2px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 10px 14px; border: 1px solid var(--color-border);
    border-radius: var(--radius); font-size: var(--text-sm); font-family: var(--font-body);
    color: var(--color-text); background: var(--color-surface); outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 100px; }
  .form-hint { font-size: var(--text-label); color: var(--color-text-muted); margin-top: var(--space-half); }
  .form-hint.error { color: #d44; }
  .char-count { float: right; }

  /* CAPTCHA */
  .captcha-row { display: flex; align-items: center; gap: 10px; }
  .captcha-question {
    background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 10px var(--space-2); font-size: var(--text-body); font-weight: var(--weight-bold); color: var(--color-text);
    white-space: nowrap; letter-spacing: 1px;
  }
  .captcha-input { width: 80px; text-align: center; }
  .captcha-refresh {
    background: none; border: 1px solid var(--color-border); border-radius: var(--radius);
    width: 38px; height: 38px; cursor: pointer; font-size: var(--text-body); transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .captcha-refresh:hover { border-color: var(--accent); }

  /* Submit */
  .submit-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-on); font-size: var(--text-body); font-weight: var(--weight-medium);
    font-family: var(--font-body); cursor: pointer; margin-top: var(--space-1);
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .submit-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-lift); }
  .submit-btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* DELETE */
  .board-delete-btn {
    display: inline-flex; align-items: center; gap: var(--space-half);
    color: var(--color-text-muted); font-size: var(--text-label); cursor: pointer;
    background: none; border: 1px solid var(--color-border); border-radius: var(--radius-pill);
    padding: 5px 12px; font-family: var(--font-body); transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
    margin-left: var(--space-1);
  }
  .board-delete-btn:hover { color: #d44; border-color: #d44; }

  /* SOURCE BADGE */
  .board-source {
    font-size: var(--text-label); font-weight: var(--weight-semibold); padding: 2px var(--space-1);
    border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0;
  }
  .board-source.user { background: var(--color-surface); color: var(--color-text-muted); border: 1px solid var(--color-border); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--color-text); color: var(--color-bg); padding: 12px var(--space-3);
    border-radius: var(--radius-pill); font-size: var(--text-sm); font-family: var(--font-body);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 300;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* DELETE PROMPT */
  .delete-prompt {
    display: flex; align-items: center; gap: var(--space-1); margin-top: 12px;
    padding: 10px 14px; background: var(--color-bg); border-radius: var(--radius);
  }
  .delete-prompt input {
    flex: 1; padding: 6px 10px; border: 1px solid var(--color-border);
    border-radius: var(--radius); font-size: var(--text-label); font-family: var(--font-body); outline: none;
  }
  .delete-prompt input:focus { border-color: var(--accent); }
  .delete-prompt button {
    padding: 6px 14px; border: none; border-radius: var(--radius);
    font-size: var(--text-label); font-family: var(--font-body); cursor: pointer; font-weight: var(--weight-semibold);
  }
  .delete-confirm { background: var(--color-text); color: var(--color-bg); font-weight: var(--weight-bold); }
  .delete-cancel { background: var(--color-border); color: var(--color-text); }

  @media print {
    #site-header, #search-section, #filter-section, #pagination, .board-ask-btn, .write-btn { display: none !important; }
    .board-item.open .board-a { display: block !important; }
    body { max-width: 100%; }
    /* 접힌 섹션이 그대로 인쇄되면 내용이 빠진 것처럼 보인다. 목차는 종이에서 무용. */
    .answer-outline, #glance-jump-core { display: none !important; }
    .msg-bubble.bot details > *:not(summary) { display: block !important; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->

<!-- ═══ MAIN ═══ -->
<main>

  <!-- SEARCH BAR -->
  <section id="search-section">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="검색어를 입력하세요 (예: 주휴수당, 퇴직금)" autocomplete="off">

</main>

<!-- ═══ WRITE MODAL ═══ -->
<div class="modal-overlay" id="write-modal" onclick="if(event.target===this)closeWriteModal()">
  <div class="modal-box">

      <div class="form-group">

        <input class="form-input" id="w-password" type="password" maxlength="20" placeholder="4~20자" required>
      </div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="w-category">
          <option value="일반상담">일반상담</option>

          <option value="실업급여">실업급여</option>
          <option value="휴가·휴일">휴가·휴일</option>
          <option value="4대보험">4대보험</option>
          <option value="산업재해">산업재해</option>
          <option value="직장내 괴롭힘">직장내 괴롭힘</option>
          <option value="육아·출산">육아·출산</option>
          <option value="임금체불">임금체불</option>
          <option value="근로장려금">근로장려금</option>

        <textarea class="form-textarea" id="w-question" maxlength="2000" placeholder="노동법 관련 질문을 작성해주세요 (10~2000자)" required oninput="updateCharCount()"></textarea>
        <div class="form-hint"><span class="char-count" id="w-charcount">0/2000</span></div>

        <div class="captcha-row">

          <input class="form-input captcha-input" id="w-captcha" type="number" placeholder="답" required>
          <button type="button" class="captcha-refresh" onclick="loadCaptcha()" title="새로고침">&#x21bb;</button>
        </div>
      </div>
      <div id="w-error" class="form-hint error" style="display:none;margin-bottom:12px"></div>

<footer id="site-footer">

      <span style="color:var(--color-border)" aria-hidden="true">|</span>
      <a href="/terms.html">이용약관</a>
      <span style="color:var(--color-border)" aria-hidden="true">|</span>
      <a href="/install.html">앱 설치</a>

<script>
var API_BASE = location.hostname.includes('github.io')
  ? 'https://laborconsult.vercel.app'
  : '';

// ── State ──
var boardState = { page: 1, q: '', category: '' };
var answerCache = {};
var searchTimer = null;

// ── Helpers ──
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getTimeAgo(isoStr) {
  if (!isoStr) return '';
  var diff = Date.now() - new Date(isoStr).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '방금 전';
  if (mins < 60) return mins + '분 전';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '시간 전';
  var days = Math.floor(hours / 24);
  if (days < 30) return days + '일 전';
  return new Date(isoStr).toLocaleDateString('ko-KR');
}

// ── URL Params ──
function parseUrlParams() {
  var params = new URLSearchParams(window.location.search);
  boardState.page = parseInt(params.get('page')) || 1;
  boardState.q = params.get('q') || '';
  boardState.category = params.get('category') || '';
}

function updateUrl() {
  var params = new URLSearchParams();
  if (boardState.q) params.set('q', boardState.q);
  if (boardState.category) params.set('category', boardState.category);
  if (boardState.page > 1) params.set('page', boardState.page);
  var qs = params.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

// ── Category ──
function selectCategory(btn, cat) {
  document.querySelectorAll('.cat-chip').forEach(function(c) { c.classList.remove('active'); });
  btn.classList.add('active');
  boardState.category = cat;
  boardState.page = 1;
  loadBoard();
  updateUrl();
}

async function loadCategories() {
  try {
    var resp = await fetch(API_BASE + '/api/board/categories');
    if (!resp.ok) return;
    var data = await resp.json();

    var container = document.getElementById('category-chips');
    data.categories.forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'cat-chip';
      if (boardState.category === cat.name) btn.classList.add('active');
      btn.dataset.cat = cat.name;
      btn.textContent = cat.name;
      btn.onclick = function() { selectCategory(btn, cat.name); };
      container.appendChild(btn);
    });

    // "전체" 버튼 active 상태 동기화
    if (boardState.category) {
      container.querySelector('[data-cat=""]').classList.remove('active');
    }

    document.getElementById('total-count').textContent = data.total.toLocaleString();
  } catch (e) {
    console.error('Categories load error:', e);
  }
}

// ── Board List ──
async function loadBoard() {
  var list = document.getElementById('board-list');
  list.innerHTML = '<div class="loading-skeleton">' +
    '<div class="skeleton-item"></div>'.repeat(5) + '</div>';

  var url = API_BASE + '/api/board/search?page=' + boardState.page + '&per_page=15';
  if (boardState.q) url += '&q=' + encodeURIComponent(boardState.q);
  if (boardState.category) url += '&category=' + encodeURIComponent(boardState.category);

  try {
    var resp = await fetch(url);
    if (!resp.ok) throw new Error('API error ' + resp.status);
    var data = await resp.json();

    list.innerHTML = '';

    if (data.items.length === 0) {
      list.innerHTML =
        '<div class="empty-state">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
        '<p>검색 결과가 없습니다</p>' +
        '<p class="empty-sub">다른 키워드로 검색해보세요</p>' +
        '</div>';
      document.getElementById('result-info').textContent = '';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    // Result info + 글쓰기 버튼
    var info = document.getElementById('result-info');
    var catLabel = boardState.category ? ' (' + escHtml(boardState.category) + ')' : '';
    info.innerHTML = '<span>총 ' + data.total.toLocaleString() + '건' + catLabel + '</span>' +
      '<button class="write-btn" onclick="openWriteModal()"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg> 질문하기</button>';

    // Render items
    data.items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'board-item';
      div.dataset.id = item.id;
      div.dataset.source = item.source || 'ai';

      var timeAgo = getTimeAgo(item.created_at);
      var sourceBadge = item.source === 'user'
        ? '<span class="board-source user">질문</span>'
        : '';
      div.innerHTML =
        '<div class="board-q" onclick="openDetail(\'' + item.id + '\')">' +
          '<span class="board-cat">' + escHtml(item.category || '일반') + '</span>' +
          sourceBadge +
          '<span class="board-text">' + escHtml(item.question) + '</span>' +
          '<span class="board-time">' + timeAgo + '</span>' +
          '<span class="board-chevron">&#8250;</span>' +
        '</div>';
      list.appendChild(div);
    });

    renderPagination(data.page, data.total_pages);
  } catch (e) {
    console.error('Board load error:', e);
    list.innerHTML =
      '<div class="empty-state">' +
      '<p>질문을 불러올 수 없습니다</p>' +
      '<p class="empty-sub">잠시 후 다시 시도해주세요</p>' +
      '</div>';
  }
}

// ── Detail View ──
var currentDetailId = null;

async function openDetail(id) {
  // 목록 숨기고 상세 표시
  document.getElementById('board-hero').style.display = 'none';
  document.querySelector('#search-section').style.display = 'none';
  document.querySelector('#filter-section').style.display = 'none';
  document.getElementById('board-section').style.display = 'none';
  document.getElementById('pagination').style.display = 'none';
  var detail = document.getElementById('detail-view');
  detail.classList.add('active');
  currentDetailId = id;

  var chatArea = document.getElementById('detail-chat');
  var metaArea = document.getElementById('detail-meta');
  var actionsArea = document.getElementById('detail-actions');
  chatArea.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--color-text-muted)">불러오는 중...</div>';
  metaArea.innerHTML = '';
  actionsArea.innerHTML = '';

  // URL 업데이트
  history.pushState({detail: id}, '', '?id=' + id);
  window.scrollTo({top: 0});

  // 캐시 확인
  if (answerCache[id]) {
    renderDetail(answerCache[id]);
    return;
  }

  try {
    var resp = await fetch(API_BASE + '/api/board/' + id);
    if (!resp.ok) throw new Error('Fetch failed');
    var data = await resp.json();
    answerCache[id] = data;
    renderDetail(data);
  } catch (e) {
    chatArea.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--color-text-muted)">불러올 수 없습니다</div>';
  }
}

function renderDetail(data) {
  var chatArea = document.getElementById('detail-chat');
  var metaArea = document.getElementById('detail-meta');
  var actionsArea = document.getElementById('detail-actions');

  // 메타 정보
  var timeAgo = getTimeAgo(data.created_at);
  var catHtml = '<span class="board-cat">' + escHtml(data.category || '일반') + '</span>';
  var nickHtml = data.nickname ? '<span>' + escHtml(data.nickname) + '</span>' : '';
  metaArea.innerHTML = catHtml + nickHtml + '<span>' + timeAgo + '</span>';

  // 채팅 영역
  var html = '';

  // 질문 (user 말풍선)
  html += '<div class="msg-wrap user-side">';
  html += '<span class="msg-label">질문</span>';
  html += '<div class="msg-bubble user">' + escHtml(data.question) + '</div>';
  html += '</div>';

  // 답변 (bot 말풍선) 또는 미답변
  if (data.source === 'user' || !data.answer) {
    html += '<div class="no-answer">아직 AI 답변이 없습니다</div>';
  } else {
    var rendered = DOMPurify.sanitize(marked.parse(data.answer));
    html += '<div class="msg-wrap bot-side">';
    html += '<span class="msg-label">AI 답변</span>';
    html += '<div class="msg-bubble bot">' + rendered + '</div>';
    html += '</div>';
  }
  chatArea.innerHTML = html;
  // 목차·접기 적용. 게시판은 스트리밍이 없어 렌더 직후 바로 호출하면 된다.
  if (window.answerGlance) {
    window.answerGlance.finalize(chatArea.querySelector('.msg-bubble.bot'));
  }

  // 하단 액션 버튼
  var askUrl = '/?q=' + encodeURIComponent(data.question.substring(0, 80));
  var askLabel = (data.source === 'user') ? 'AI에게 물어보기' : '비슷한 질문하기';
  var actHtml =
    '<a href="' + escHtml(askUrl) + '" class="board-ask-btn">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
      askLabel +
    '</a>';
  if (data.source === 'user') {
    actHtml += '<button class="board-delete-btn" onclick="showDeletePrompt(\'' + data.id + '\',this)"><svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg> 삭제</button>';
  }
  actionsArea.innerHTML = actHtml;
}

function closeDetail() {
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('board-hero').style.display = '';
  document.querySelector('#search-section').style.display = '';
  document.querySelector('#filter-section').style.display = '';
  document.getElementById('board-section').style.display = '';
  document.getElementById('pagination').style.display = '';
  currentDetailId = null;
  updateUrl();
  window.scrollTo({top: 0});
}

// 브라우저 뒤로가기 지원
window.addEventListener('popstate', function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('id')) {
    openDetail(params.get('id'));
  } else if (currentDetailId) {
    closeDetail();
  }
});

// ── Pagination ──
function renderPagination(page, totalPages) {
  var nav = document.getElementById('pagination');
  nav.innerHTML = '';
  if (totalPages <= 1) return;

  function addBtn(text, targetPage, disabled) {
    var btn = document.createElement('button');
    btn.className = 'page-btn';
    btn.textContent = text;
    btn.disabled = disabled;
    if (targetPage === page) btn.classList.add('active');
    if (!disabled) {
      btn.onclick = function() {
        boardState.page = targetPage;
        loadBoard();
        updateUrl();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    }
    nav.appendChild(btn);
  }

  addBtn('\u25C0', page - 1, page <= 1);

  var start = Math.max(1, page - 3);
  var end = Math.min(totalPages, start + 6);
  start = Math.max(1, end - 6);

  for (var i = start; i <= end; i++) {
    addBtn(i, i, false);
  }

  addBtn('\u25B6', page + 1, page >= totalPages);
}

// ── Search Debounce ──
document.getElementById('search-input').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  var val = e.target.value;
  searchTimer = setTimeout(function() {
    boardState.q = val.trim();
    boardState.page = 1;
    loadBoard();
    updateUrl();
  }, 300);
});

// ── Write Modal ──
var captchaToken = '';
// 429 잠금 해제 시각(ms). 모달을 닫았다 열어도 유지된다 — rate limit은 서버 기준이다.
var rateLimitedUntil = 0;

function openWriteModal() {
  document.getElementById('write-modal').classList.add('active');
  document.getElementById('w-error').style.display = 'none';
  document.getElementById('write-form').reset();
  document.getElementById('w-charcount').textContent = '0/2000';
  loadCaptcha();
}

function closeWriteModal() {
  document.getElementById('write-modal').classList.remove('active');
}

function updateCharCount() {
  var len = document.getElementById('w-question').value.length;
  document.getElementById('w-charcount').textContent = len + '/2000';
}

async function loadCaptcha() {
  var qEl = document.getElementById('captcha-q');
  var submitBtn = document.getElementById('w-submit');
  qEl.textContent = '로딩 중...';
  // captchaToken은 모듈 전역이라 실패해도 이전 값이 남는다 — 먼저 비운다.
  captchaToken = '';
  // 보안문자를 확보하기 전에는 제출을 막는다. 안 막으면 서버가 403으로 거절하고
  // 여기서 재시도하는데, 발급 자체가 안 되는 상황이면 그 루프가 끝나지 않는다.
  submitBtn.disabled = true;
  try {
    var resp = await fetch(API_BASE + '/api/captcha');
    // fetch는 4xx·5xx에 reject하지 않는다 — 이 검사가 없으면 오류 본문이
    // 정상 데이터로 흘러가 문제 자리에 undefined가 찍힌다.
    if (!resp.ok) throw new Error('captcha ' + resp.status);
    var data = await resp.json();
    if (!data || !data.token || !data.question) throw new Error('captcha payload');
    qEl.textContent = data.question;
    captchaToken = data.token;
    document.getElementById('w-captcha').value = '';
    // rate limit 잠금 중이면 보안문자를 새로 받아도 열지 않는다(불변식 통일)
    submitBtn.disabled = Date.now() < rateLimitedUntil;
  } catch (e) {
    qEl.textContent = '불러오지 못했습니다 — 잠시 후 새로고침(↻)';
    submitBtn.disabled = true;
  }
}

async function submitPost(e) {
  e.preventDefault();
  var errEl = document.getElementById('w-error');
  var submitBtn = document.getElementById('w-submit');
  errEl.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = '등록 중...';

  var body = {
    nickname: document.getElementById('w-nickname').value.trim(),
    password: document.getElementById('w-password').value,
    category: document.getElementById('w-category').value,
    question: document.getElementById('w-question').value.trim(),
    captcha_token: captchaToken,
    captcha_answer: parseInt(document.getElementById('w-captcha').value, 10) || 0
  };

  try {
    var resp = await fetch(API_BASE + '/api/board/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await resp.json();

    if (!resp.ok) {
      errEl.textContent = data.error || '오류가 발생했습니다';
      errEl.style.display = 'block';
      // await로 재로딩 결과를 먼저 확정한다 — 안 그러면 아래 finally가
      // 게이팅을 덮어써서 보안문자 없이 버튼이 열린다.
      if (resp.status === 403) await loadCaptcha();
      if (resp.status === 429) {
        // 잠금 해제 시각을 상태로 남긴다. 아래 finally가 return 직후 실행되므로
        // disabled=true 만으로는 같은 틱에 덮여 30초 잠금이 죽는다.
        rateLimitedUntil = Date.now() + 30000;
        submitBtn.disabled = true;
        setTimeout(function () {
          rateLimitedUntil = 0;
          // 30초가 지나도 보안문자가 없으면 열지 않는다 — finally와 같은 불변식.
          // 무조건 false로 열면 그 사이 CAPTCHA가 실패했을 때 토큰 없이 버튼이 열린다.
          submitBtn.disabled = !captchaToken;
        }, 30000);
      }
      return;
    }

    closeWriteModal();
    showToast('질문이 등록되었습니다');
    answerCache = {};
    boardState.page = 1;
    loadBoard();
  } catch (e) {
    errEl.textContent = '네트워크 오류가 발생했습니다';
    errEl.style.display = 'block';
  } finally {
    // 무조건 열지 않는다 — 보안문자 미확보 또는 rate limit 잠금 중이면 유지한다
    submitBtn.disabled = !captchaToken || Date.now() < rateLimitedUntil;
    submitBtn.textContent = '질문 등록하기';
  }
  return false;
}

// ── Delete ──
function showDeletePrompt(postId, btnEl) {
  var parent = btnEl.closest('.detail-actions') || btnEl.parentElement;
  var existing = parent.querySelector('.delete-prompt');
  if (existing) { existing.remove(); return; }

  var div = document.createElement('div');
  div.className = 'delete-prompt';
  div.innerHTML =
    '<input type="password" placeholder="비밀번호 입력" id="del-pw-' + postId + '">' +
    '<button class="delete-confirm" onclick="confirmDelete(\'' + postId + '\')">삭제</button>' +
    '<button class="delete-cancel" onclick="this.closest(\'.delete-prompt\').remove()">취소</button>';
  parent.appendChild(div);
  div.querySelector('input').focus();
}

async function confirmDelete(postId) {
  var pwInput = document.getElementById('del-pw-' + postId);
  if (!pwInput || !pwInput.value) return;

  try {
    var resp = await fetch(API_BASE + '/api/board/' + postId + '/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwInput.value })
    });
    var data = await resp.json();

    if (!resp.ok) {
      showToast(data.error || '삭제 실패');
      return;
    }

    showToast('삭제되었습니다');
    delete answerCache[postId];
    if (currentDetailId === postId) {
      closeDetail();
    }
    loadBoard();
  } catch (e) {
    showToast('네트워크 오류');
  }
}

// ── Toast ──
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

// ── Keyboard ──
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeWriteModal();
});

// ── Init ──
parseUrlParams();
document.getElementById('search-input').value = boardState.q;
loadCategories();
loadBoard();

(function() {
  var params = new URLSearchParams(window.location.search);
  var detailId = params.get('id');
  if (detailId) {
    setTimeout(function() { openDetail(detailId); }, 100);
  }
})();
</script>
