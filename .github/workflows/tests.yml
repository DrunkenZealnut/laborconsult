name: Offline Tests

# API 키 없이 도는 오프라인 스위트 — 계산 엔진 골든 + 파이프라인 배선 + 검색/인용 단위
# + 남용 가드(인젝션·스코프·쿼터) + LLM 폴백 경화 + 판례 수집 + 답변 렌더러 회귀
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 계산 엔진 골든 테스트
        run: python3 test_wage_golden.py

      - name: 법률 기준 갱신·관리자 API
        run: python3 -m unittest test_legal_rule_updates test_legal_rule_api -v

      - name: 법률 기준 관리 화면
        run: node --test test_admin_legal_rules.js test_admin_quality.js test_kin_format.js test_admin_model_settings.js

      - name: 법률 기준 PostgreSQL 트랜잭션·권한 검증
        env:
          LEGAL_RULE_SQL_TEST: 'true'
        run: |
          docker pull postgres:17
          python3 -m unittest test_legal_rule_sql test_model_settings_sql -v

      - name: 파이프라인 배선 테스트
        run: python3 test_pipeline_wiring.py

      - name: 검색·인용 모듈 단위 테스트
        run: python3 test_offline_units.py

      - name: 남용 가드 테스트
        run: python3 test_abuse_guard.py

      - name: LLM 폴백 경화 테스트
        run: python3 test_llm_fallback.py

      - name: 답변 모델 설정 테스트
        run: python3 test_model_settings.py

      - name: LLM 폴백 감시 판정 테스트
        run: python3 test_llm_fallback_alert.py

      - name: 임금 답변 규칙 테스트(단시간 주휴·예시 시급·effort·인용 정규식)
        run: python3 test_wage_answer_rules.py

      # 이 둘은 CI에 없었다 — 게시·조회 권한 결함(2026-10-03)이 테스트 밖에서 드러난 이유 중 하나다.
      - name: 상담 품질 평가 하네스·관리자 조회 테스트
        run: |
          python3 test_consultation_eval.py
          python3 test_admin_consultation_quality.py

      - name: 지식iN 정확도 회귀(폐기 기준 필터·현행 규칙 블록·인용 관련성·평가 매처)
        run: |
          python3 test_kin_accuracy.py
          python3 eval_consultation.py --offline --fixture data/eval_kin_queries.json

      - name: 기준일 판본 조회·그래프 판례 원문 게이트·인용 화이트리스트 테스트
        run: python3 test_effective_law.py

      - name: 확인청구 기관·괴롭힘 판정기 사실 전제 테스트
        run: python3 test_claim_assessor_facts.py

      - name: 판례 수집·업로드 테스트
        run: python3 test_precedent_ingest.py

      # 메모리는 사람이 기억해서 재는 값이었고, 그래서 RSS가 Vercel 한도의
      # 119%가 될 때까지 아무도 몰랐다. 초과 시 하이브리드 검색이 조용히
      # Dense-only로 떨어진다 — 경고가 아니라 실패로 둔다.
      - name: BM25 메모리·색인 생존 테스트
        run: python3 test_bm25_memory.py

      # 토크나이저는 API 키 없이 전량 측정이 가능한 몇 안 되는 영역이고,
      # 이 결함(연차휴가→연차휴 등)이 오래 살아남은 이유가 측정 수단의 부재였다.
      # CI 러너에는 konlpy가 없어 자동으로 프로덕션 경로(정규식)를 잰다.
      #
      # **`--full`(M4)을 반드시 포함할 것.** M4가 유일한 *검색 품질* 지표이고
      # 나머지(M1~M3·M5~M7)는 전부 구조·성능 검사다. `--check`만 돌리면 토큰화가
      # 랭킹을 어떻게 바꿨는지 아무도 보지 않는다 — 이 사이클이 고치려던 것과
      # 정확히 같은 실패 모드다. 실측 약 4.5초·460MB(macOS 76,983문서).
      - name: 토크나이저 품질 측정
        run: python3 eval_tokenizer.py --check --full

      - name: 답변 렌더러 회귀 테스트
        run: node --test test_answer_renderer.js

      - name: 답변 조망 레이어 테스트
        run: node --test test_answer_glance.js

      - name: 공개 페이지 fetch 오류 처리 테스트
        run: node --test test_public_fetch.js
