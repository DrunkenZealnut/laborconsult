name: Offline Tests

# API 키 없이 도는 오프라인 스위트 — 계산 엔진 골든 + 파이프라인 배선 + 검색/인용 단위
# + 남용 가드(인젝션·스코프·쿼터) + LLM 폴백 경화 + 판례 수집 + 답변 렌더러 회귀
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 계산 엔진 골든 테스트
        run: python3 test_wage_golden.py

      - name: 법률 기준 갱신·관리자 API
        run: python3 -m unittest test_legal_rule_updates test_legal_rule_api -v

      - name: 법률 기준 관리 화면
        run: node --test test_admin_legal_rules.js test_admin_quality.js test_kin_format.js test_admin_model_settings.js

      - name: 법률 기준 PostgreSQL 트랜잭션·권한 검증
        env:
          LEGAL_RULE_SQL_TEST: 'true'
        run: |
          docker pull postgres:17
          python3 -m unittest test_legal_rule_sql test_model_settings_sql test_abuse_guard_sql -v

      - name: 파이프라인 배선 테스트
        run: python3 test_pipeline_wiring.py

      - name: 검색·인용 모듈 단위 테스트
        run: python3 test_offline_units.py

      - name: 남용 가드 테스트
        run: python3 test_abuse_guard.py

      - name: LLM 폴백 경화 테스트
        run: python3 test_llm_fallback.py

      - name: LLM 전송 계층(AI Gateway OIDC) 테스트
        run: python3 test_llm_transport.py

      - name: 답변 모델 설정 테스트
        run: python3 test_model_settings.py

      - name: LLM 폴백 감시 판정 테스트
        run: python3 test_llm_fallback_alert.py

      - name: 임금 답변 규칙 테스트(단시간 주휴·예시 시급·effort·인용 정규식)
        run: python3 test_wage_answer_rules.py

      # 이 둘은 CI에 없었다 — 게시·조회 권한 결함(2026-10-03)이 테스트 밖에서 드러난 이유 중 하나다.
      - name: 상담 품질 평가 하네스·관리자 조회 테스트
        run: |
          python3 test_consultation_eval.py
          python3 test_admin_consultation_quality.py

      - name: 지식iN 정확도 회귀(폐기 기준 필터·현행 규칙 블록·인용 관련성·평가 매처)
        run: |
          python3 test_kin_accuracy.py
          python3 eval_consultation.py --offline --fixture data/eval_kin_queries.json

      - name: 기준일 판본 조회·그래프 판례 원문 게이트·인용 화이트리스트 테스트
        run: python3 test_effective_law.py

      - name: 확인청구 기관·괴롭힘 판정기 사실 전제 테스트
        run: python3 test_claim_assessor_facts.py

      # 프로덕션(Vercel) IP는 법제처 미등록이라 실호출이 전부 인증 실패한다 — 예열 키·조회 키 불일치,
      # 인증 오류를 '없음'으로 읽는 경로, 감시 공백이 모두 조용히 실패하는 클래스다.
      - name: 법제처 조회 복구(예열 키·인증 오류·키워드 조문·감시) 테스트
        run: python3 test_law_api_recovery.py

      - name: 판례 수집·업로드 테스트
        run: python3 test_precedent_ingest.py

      - name: 보완 공식 근거 전달·사실 단위·절차 회귀 테스트
        run: python3 test_source_followup.py

      # 외부 점검(2026-10-11) 오답은 정답 지침이 질문 어휘에 안 닿거나(패턴 누락) 지침 사실이 원문과
      # 대조되지 않은 데서 났다 — 둘 다 예외 없이 조용한 실패라 고정 테스트가 유일한 탐지 수단이다.
      - name: 외부 점검 50문항 회귀(쟁점 근거 패턴·지침 앵커·감지 규칙·월급 구성 가드)
        run: |
          python3 test_audit50.py
          python3 eval_consultation.py --offline --fixture data/eval_audit50_queries.json

      # 계산 카드는 "이 수치를 사용하세요"로 LLM에 들어가 답변 금액이 된다. 소정·연장 분리, 1일 소정근로시간, 평균임금·보수의
      # 연장수당, 최저임금 두 구성 판정이 돌아오면 예외 없이 틀린 금액이 나간다(calc-card-followups).
      - name: 계산 카드 후속 회귀(소정·연장 분리·1일 소정근로시간·평균임금 연장수당·최저임금 두 구성)
        run: |
          python3 test_calc_card_followups.py
          python3 eval_consultation.py --offline --fixture data/eval_calc_card_queries.json

      # 한 카드 안의 금액은 같은 월 금액에서 나와야 한다. 연장수당을 묻지 않은 질문에서 월 총액이 연장분을 빼 세후가 세전보다
      # 크게 나왔다(calc-card-consistency G2) — 갈린 숫자는 예외를 내지 않아 불변식 격자가 유일한 탐지 수단이다. 미확인 모드의
      # 조건부 예시는 조건 하나가 빠지면 실근로가 소정근로로 단정된 값이 카드에 실린다(kin-01·a50-40).
      - name: 계산 카드 금액 일관성(월 총 = 세전 월 급여·세후 ≤ 세전·평균임금 월액, 미확인 모드 조건부 예시)
        run: python3 test_calc_card_consistency.py

      # 월 임금(기준 월액)과 평균임금 일액은 각각 한 함수다. 계산기마다 따로 만들던 때 고정연장수당·직책수당이 계산기마다 빠지거나
      # 들어가 한 카드 안에서 금액이 갈렸고, 휴업수당은 근로기준법 제2조 제2항 하한 없이 법정 금액 아래로 나왔다(monthly-base-unification).
      - name: 기준 월액·평균임금 일액 단일 출처(고정수당 격자·등가·휴업 하한)
        run: python3 test_monthly_base_unification.py

      # 갱신 fixture는 null(보류해야 할 값)을 담는다 — 검증 단계가 없어 스키마 실패가 머지 뒤까지 드러나지 않았다
      - name: 2026년 10월 계산기 갱신(미실행 카드·입력 연결)
        run: |
          python3 test_wage_update_2026.py
          python3 eval_consultation.py --offline --fixture data/eval_wage_update_queries.json

      # 갱신 모듈별 회귀 — 머지 때 CI에 빠져 있어 육아휴직 6+6·월급제 주휴 채권·수당 주기 보류 같은 결함을 CI가 보지
      # 못했다(Codex 리뷰). 모듈을 고치면 여기서 잡힌다
      - name: 2026년 10월 계산기 갱신 — 모듈별 회귀(육아휴직·체불이자·입력 연결·일할·체불 원금)
        run: |
          set -e
          python3 test_parental_benefits_update.py
          python3 test_arrears_interest_update.py
          python3 test_pay_input_update.py
          python3 test_proration_update.py
          python3 test_wage_claims_update.py

      # 메모리는 사람이 기억해서 재는 값이었고, 그래서 RSS가 Vercel 한도의
      # 119%가 될 때까지 아무도 몰랐다. 초과 시 하이브리드 검색이 조용히
      # Dense-only로 떨어진다 — 경고가 아니라 실패로 둔다.
      - name: BM25 메모리·색인 생존 테스트
        run: python3 test_bm25_memory.py

      # 토크나이저는 API 키 없이 전량 측정이 가능한 몇 안 되는 영역이고,
      # 이 결함(연차휴가→연차휴 등)이 오래 살아남은 이유가 측정 수단의 부재였다.
      # CI 러너에는 konlpy가 없어 자동으로 프로덕션 경로(정규식)를 잰다.
      #
      # **`--full`(M4)을 반드시 포함할 것.** M4가 유일한 *검색 품질* 지표이고
      # 나머지(M1~M3·M5~M7)는 전부 구조·성능 검사다. `--check`만 돌리면 토큰화가
      # 랭킹을 어떻게 바꿨는지 아무도 보지 않는다 — 이 사이클이 고치려던 것과
      # 정확히 같은 실패 모드다. 실측 약 4.5초·460MB(macOS 76,983문서).
      - name: 토크나이저 품질 측정
        run: python3 eval_tokenizer.py --check --full

      - name: 답변 렌더러 회귀 테스트
        run: node --test test_answer_renderer.js

      - name: 답변 조망 레이어 테스트
        run: node --test test_answer_glance.js

      # 일일 횟수에 걸린 뒤에도 거절 문구가 답변처럼 그려지고 입력창이 다시 열려 정상처럼 보였다(2026-10-06).
      - name: 채팅 이용 제한 잠금·거절 안내 테스트
        run: node --test test_chat_lock.js

      - name: 공개 페이지 fetch 오류 처리 테스트
        run: node --test test_public_fetch.js
