name: Offline Tests

# API 키 없이 도는 오프라인 스위트 — 계산 엔진 골든 + 파이프라인 배선 + 검색/인용 단위
# + 남용 가드(인젝션·스코프·쿼터) + LLM 폴백 경화 + 답변 렌더러 회귀
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 계산 엔진 골든 테스트
        run: python3 test_wage_golden.py

      - name: 파이프라인 배선 테스트
        run: python3 test_pipeline_wiring.py

      - name: 검색·인용 모듈 단위 테스트
        run: python3 test_offline_units.py

      - name: 남용 가드 테스트
        run: python3 test_abuse_guard.py

      - name: LLM 폴백 경화 테스트
        run: python3 test_llm_fallback.py

      - name: 답변 렌더러 회귀 테스트
        run: node --test test_answer_renderer.js

      - name: 답변 조망 레이어 테스트
        run: node --test test_answer_glance.js

      - name: 공개 페이지 fetch 오류 처리 테스트
        run: node --test test_public_fetch.js
